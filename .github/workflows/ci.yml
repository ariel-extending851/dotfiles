name: "CI / DevSecOps & IaC Quality Gate"

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  secrets-audit:
    name: "Gitleaks Static Secrets Analysis"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Run Gitleaks Action"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  shell-lint:
    name: "Shell Scripts AST Syntax Check"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Validate bash scripts syntax"
        run: |
          set -e
          find . -name "*.sh" -not -path "*/.git/*" -exec bash -n {} +
          bash -n scripts/.local/bin/theme-switch

  lint:
    name: "Ansible Lint & Syntax Check"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Install Ansible, Lint & Collections"
        run: |
          pip install ansible-core ansible-lint
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: "Run Ansible Lint"
        run: ansible-lint

      - name: "Syntax check playbooks"
        run: |
          ansible-playbook -i ansible/local/hosts.ini ansible/local/setup_pc.yml --syntax-check
          ansible-playbook -i ansible/local/hosts.ini ansible/local/verify.yml --syntax-check

  molecule:
    name: "Molecule Role Testing (Idempotence & State)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Install Molecule & Plugins"
        run: |
          pip install molecule "molecule-plugins[docker]" ansible-core
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: "Run Molecule test on system_tuning role"
        working-directory: ansible/roles/system_tuning
        run: molecule test
