# ==============================================================================
# .mise.toml - Workstation & IaC Task Orchestration (SRE Platform)
# ==============================================================================

[tasks.lint]
description = "Run static analysis with ansible-lint inside SRE toolbox"
run = "distrobox enter sre-toolbox --no-tty -- ansible-lint"

[tasks."test:syntax"]
description = "Validate syntax of all playbooks"
run = "ansible-playbook -i ansible/local/hosts.ini ansible/local/setup_pc.yml --syntax-check && ansible-playbook -i ansible/local/hosts.ini ansible/local/verify.yml --syntax-check"

[tasks."test:molecule"]
description = "Run Molecule integration and idempotency test on system_tuning role"
dir = "ansible/roles/system_tuning"
run = "molecule test"

[tasks.verify]
description = "Run deep host verification assertions (GPU, Secure Boot, Podman Socket, DevPod)"
run = "ansible-playbook -i ansible/local/hosts.ini ansible/local/verify.yml"

[tasks.apply]
description = "Apply user dotfiles, brew tools, DevPod and podman socket"
run = "ansible-playbook -i ansible/local/hosts.ini ansible/local/setup_pc.yml --tags user"

[tasks."apply:system"]
description = "Apply root system tuning and hardening"
run = "ansible-playbook -i ansible/local/hosts.ini ansible/local/setup_pc.yml --tags system,sysctl,performance,security -K"

[tasks."apply:hardening"]
description = "Apply network, DNS and firewall security hardening only"
run = "ansible-playbook -i ansible/local/hosts.ini ansible/local/setup_pc.yml --tags security,sysctl,performance,firewall -K"


[tasks.test]
description = "Run complete test suite (syntax and host verification)"
depends = ["lint", "test:syntax", "verify"]

[tasks."apply:eud"]
description = "Apply EUD station setup (Ollama, Flatpaks, TileServer, SatDump)"
run = "ansible-playbook -i ansible/local/hosts.ini ansible/local/setup_pc.yml --tags eud -K"

[tasks."apply:eud:user"]
description = "Apply EUD user services only (Ollama, Flatpaks, Bitcoin, Electrs)"
run = "ansible-playbook -i ansible/local/hosts.ini ansible/local/setup_pc.yml --tags ollama,flatpak,bitcoin,sdr"

[tasks."apply:bitcoin"]
description = "Apply Bitcoin Core & Electrs Sovereign Full Node Quadlets"
run = "ansible-playbook -i ansible/local/hosts.ini ansible/local/setup_pc.yml --tags bitcoin"

[tasks."bitcoin:unlock"]
description = "Unlock LUKS2 vault, mount /var/mnt/bitcoin-data, and start bitcoind + electrs"
run = "./scripts/bitcoin-luks.sh unlock"

[tasks."bitcoin:lock"]
description = "Stop bitcoind + electrs, unmount /var/mnt/bitcoin-data, and lock LUKS2 partition"
run = "./scripts/bitcoin-luks.sh lock"

[tasks."bitcoin:status"]
description = "Check status of Bitcoin LUKS mapper, mountpoint, and Quadlet services"
run = "./scripts/bitcoin-luks.sh status"

[tasks."bitcoin:logs"]
description = "Follow live logs from bitcoind and electrs"
run = "./scripts/bitcoin-luks.sh logs"


[tasks."apply:eud:satdump"]
description = "Apply SatDump satellite tooling (requires root)"
run = "ansible-playbook -i ansible/local/hosts.ini ansible/local/setup_pc.yml --tags satdump -K"

[tasks."distrobox:create"]
description = "Assemble the SRE Distrobox toolbox container"
run = "distrobox assemble create --file distrobox/distrobox.ini"

[tasks."distrobox:enter"]
description = "Enter the SRE Distrobox toolbox interactive shell"
run = "distrobox enter sre-toolbox"

[tasks."distrobox:rm"]
description = "Remove the SRE Distrobox container"
run = "distrobox rm -f sre-toolbox"

[tasks."apply:distrobox"]
description = "Provision SRE Distrobox environment via Ansible"
run = "ansible-playbook -i ansible/local/hosts.ini ansible/local/setup_pc.yml --tags distrobox"

[tasks."provision:distrobox"]
description = "Re-run SRE Distrobox provisioning script directly inside container"
run = "distrobox enter sre-toolbox --no-tty -- sudo bash /var/home/agfonseca/Projects/dotfiles/distrobox/provision-sre.sh"

[tasks.bootstrap]
description = "Run full zero-to-hero workstation bootstrap (Fedora Atomic)"
run = "./bootstrap.sh"

[tasks."apply:visual"]
description = "Apply Omakase visual layer, fonts, and COSMIC dotfiles"
run = "ansible-playbook -i ansible/local/hosts.ini ansible/local/setup_pc.yml --tags visual,fonts,cosmic"

[tasks.theme]
description = "Switch desktop theme (tokyonight, catppuccin, gruvbox, kanagawa)"
run = "theme-switch"

[tasks."telemetry:status"]
description = "Check status of Torre telemetry collector, node-exporter, and Alloy forwarder"
run = "systemctl --user status node-exporter.service alloy.service torre-telemetry.timer"

[tasks."telemetry:metrics"]
description = "Inspect live Prometheus metrics exported on Torre localhost:9100"
run = "curl -s http://127.0.0.1:9100/metrics | grep -E 'node_gpu|node_bitcoin|node_disk_luks'"

[tasks."telemetry:export"]
description = "Force immediate refresh of Torre GPU, Bitcoin, and disk metrics"
run = "./scripts/export-torre-telemetry.sh && cat ~/.local/share/node_exporter/textfile/torre.prom"


