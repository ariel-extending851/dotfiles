---
# ==============================================================================
# Play 1: Host Configuration (NVIDIA Drivers & Secure Boot)
# Runs with root privileges (become: true). Use -K (--ask-become-pass).
# ==============================================================================
- name: "Host Configuration - NVIDIA Drivers & Secure Boot"
  hosts: localhost
  connection: local
  gather_facts: true
  become: true
  tags:
    - system

  vars:
    # Kernel arguments required for NVIDIA proprietary driver
    nvidia_kargs:
      - "rd.driver.blacklist=nouveau,nova-core"
      - "modprobe.blacklist=nouveau,nova-core"
      - "nvidia-drm.modeset=1"

    # Layered packages for NVIDIA
    nvidia_packages:
      - akmod-nvidia
      - xorg-x11-drv-nvidia
      - xorg-x11-drv-nvidia-cuda

    # Optional MOK password from environment variable (empty by default)
    mok_enroll_password: "{{ lookup('env', 'MOK_ENROLL_PASSWORD') | default('', true) }}"

  tasks:
    - name: "Check if system is running Fedora Atomic (OSTree)"
      ansible.builtin.stat:
        path: /run/ostree-booted
      register: ostree_booted

    - name: "Check for NVIDIA GPU hardware"
      ansible.builtin.shell: "lspci -nn | grep -iE 'vga|3d controller' | grep -i nvidia"
      register: nvidia_gpu_check
      failed_when: false
      changed_when: false

    - name: "Manage NVIDIA & Secure Boot on Fedora Atomic"
      when:
        - ostree_booted.stat.exists
        - nvidia_gpu_check.rc == 0
      tags:
        - nvidia
        - secureboot
      block:
        # 1. RPM Fusion Repositories
        - name: "Check if RPM Fusion repository package is installed"
          ansible.builtin.command:
            cmd: rpm -q rpmfusion-nonfree-release
          register: rpmfusion_check
          failed_when: false
          changed_when: false

        - name: "Install RPM Fusion repositories via rpm-ostree"
          ansible.builtin.command:
            cmd: >
              rpm-ostree install --idempotent --unchanged-exit-77
              https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm
              https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm
          register: rpmfusion_install
          failed_when: rpmfusion_install.rc != 0 and rpmfusion_install.rc != 77
          changed_when: rpmfusion_install.rc == 0

        # 1.5 Ensure MOK key generation and RPM packaging tools are available on host
        - name: "Check if akmods and rpm-build tooling are already installed"
          ansible.builtin.command:
            cmd: rpm -q akmods rpm-build
          register: build_tools_check
          failed_when: false
          changed_when: false

        - name: "Ensure akmods and rpm-build tooling are available on host"
          ansible.builtin.command:
            cmd: rpm-ostree install --idempotent --unchanged-exit-77 -y akmods rpm-build
          when: build_tools_check.rc != 0
          register: build_tools_install
          failed_when: build_tools_install.rc != 0 and build_tools_install.rc != 77
          changed_when: build_tools_install.rc == 0

        # 2. Secure Boot - MOK Key Generation & Verification (Must precede driver build)
        - name: "Check if akmods MOK public key exists"
          ansible.builtin.stat:
            path: /etc/pki/akmods/certs/public_key.der
          register: mok_cert_stat

        - name: "Generate local MOK key pair if missing"
          ansible.builtin.command:
            cmd: kmodgenca -a
          when: not mok_cert_stat.stat.exists
          register: kmodgenca_result

        - name: "Check if MOK key is enrolled in UEFI"
          ansible.builtin.command:
            cmd: mokutil --test-key /etc/pki/akmods/certs/public_key.der
          register: mok_key_test
          failed_when: false
          changed_when: false

        - name: "Check if MOK key enrollment is already pending reboot"
          ansible.builtin.command:
            cmd: mokutil --list-new
          register: mok_list_new
          failed_when: false
          changed_when: false

        - name: "Prompt for temporary MOK enrollment password (if not enrolled or pending)"
          ansible.builtin.pause:
            prompt: "Digite uma senha temporária única para registrar a chave MOK no Secure Boot (usada na tela azul MokManager ao reiniciar)"
            echo: false
          register: mok_prompt_input
          when:
            - mok_key_test.rc != 0
            - mok_list_new.stdout | trim == ""
            - mok_enroll_password | length == 0
          no_log: true

        - name: "Stage MOK key enrollment in UEFI"
          ansible.builtin.shell: |
            printf "%s\n%s\n" "{{ effective_mok_pwd }}" "{{ effective_mok_pwd }}" | mokutil --import /etc/pki/akmods/certs/public_key.der
          vars:
            effective_mok_pwd: "{{ mok_enroll_password if (mok_enroll_password | length > 0) else (mok_prompt_input.user_input | default('')) }}"
          when:
            - mok_key_test.rc != 0
            - mok_list_new.stdout | trim == ""
            - effective_mok_pwd | length > 0
          no_log: true
          register: mok_import_result

        # 3. Kernel Arguments (kargs) - Configure required kargs & clean dangerous workarounds
        - name: "Configure kernel arguments for NVIDIA driver"
          ansible.builtin.command:
            cmd: >
              rpm-ostree kargs
              --delete-if-present=initcall_blacklist=simpledrm_platform_driver_init
              {% for arg in nvidia_kargs %}
              --append-if-missing={{ arg }}
              {% endfor %}
              --unchanged-exit-77
          register: kargs_result
          failed_when: kargs_result.rc != 0 and kargs_result.rc != 77
          changed_when: kargs_result.rc == 0

        # 4. Secure Boot - Package Local MOK Keys for rpm-ostree Compose Sandbox
        # On Fedora Atomic, rpm-ostree builds akmods in an isolated sandbox that cannot
        # see /etc/pki/akmods on the host. Packaging the keys into an RPM and deploying
        # them along with macros.kmodtool ensures all kmod builds are automatically signed.
        - name: "Check if akmods-keys package is already installed"
          ansible.builtin.command:
            cmd: rpm -q akmods-keys
          register: akmods_keys_installed
          failed_when: false
          changed_when: false

        - name: "Check rpm-ostree status for pending/staged deployments"
          ansible.builtin.command:
            cmd: rpm-ostree status
          register: rpm_ostree_status_check
          changed_when: false

        - name: "Check if akmod-nvidia is currently installed"
          ansible.builtin.command:
            cmd: rpm -q akmod-nvidia
          register: akmod_nvidia_installed
          failed_when: false
          changed_when: false

        - name: "Check for any existing local kmod-nvidia packages"
          ansible.builtin.shell: "rpm -qa 'kmod-nvidia*'"
          register: installed_kmod_pkgs
          failed_when: false
          changed_when: false

        - name: "Build akmods-keys RPM package locally"
          when:
            - akmods_keys_installed.rc != 0
            - "'akmods-keys' not in rpm_ostree_status_check.stdout"
          block:
            - name: "Create akmods-keys build directories"
              ansible.builtin.file:
                path: "{{ item }}"
                state: directory
                mode: '0700'
                owner: root
                group: root
              loop:
                - /var/cache/akmods-keys-build
                - /var/cache/akmods-keys-build/SOURCES
                - /var/cache/akmods-keys-build/SPECS
                - /var/cache/akmods-keys-build/BUILD
                - /var/cache/akmods-keys-build/RPMS
                - /var/cache/akmods-keys-build/SRPMS

            - name: "Copy local MOK certificates to RPM build sources"
              ansible.builtin.copy:
                src: "{{ item.src }}"
                dest: "{{ item.dest }}"
                remote_src: true
                mode: "{{ item.mode }}"
                owner: root
                group: root
              loop:
                - { src: "/etc/pki/akmods/certs/public_key.der", dest: "/var/cache/akmods-keys-build/SOURCES/public_key.der", mode: "0644" }
                - { src: "/etc/pki/akmods/private/private_key.priv", dest: "/var/cache/akmods-keys-build/SOURCES/private_key.priv", mode: "0600" }

            - name: "Create macros.kmodtool for akmods-keys"
              ansible.builtin.copy:
                dest: /var/cache/akmods-keys-build/SOURCES/macros.kmodtool
                content: |
                  # Configured by akmods-keys for rpm-ostree module signing
                  %_kmodtool_signmodules 1
                  %_kmodtool_signmodules_pubkey /etc/pki/akmods-keys/certs/public_key.der
                  %_kmodtool_signmodules_privkey /etc/pki/akmods-keys/private/private_key.priv
                mode: '0644'
                owner: root
                group: root

            - name: "Create akmods-keys RPM spec file"
              ansible.builtin.copy:
                dest: /var/cache/akmods-keys-build/SPECS/akmods-keys.spec
                content: |
                  Name:           akmods-keys
                  Version:        0.1
                  Release:        1%{?dist}
                  Summary:        Local akmods MOK keys for rpm-ostree kmod signing
                  License:        MIT
                  BuildArch:      noarch

                  %description
                  Local MOK keys and kmodtool configuration for rpm-ostree module signing.

                  %install
                  mkdir -p %{buildroot}%{_sysconfdir}/pki/akmods-keys/certs
                  mkdir -p %{buildroot}%{_sysconfdir}/pki/akmods-keys/private
                  mkdir -p %{buildroot}%{_sysconfdir}/rpm

                  install -m 0644 %{_sourcedir}/public_key.der %{buildroot}%{_sysconfdir}/pki/akmods-keys/certs/public_key.der
                  install -m 0600 %{_sourcedir}/private_key.priv %{buildroot}%{_sysconfdir}/pki/akmods-keys/private/private_key.priv
                  install -m 0644 %{_sourcedir}/macros.kmodtool %{buildroot}%{_sysconfdir}/rpm/macros.kmodtool

                  %files
                  %dir %{_sysconfdir}/pki/akmods-keys
                  %dir %attr(0755,root,root) %{_sysconfdir}/pki/akmods-keys/certs
                  %dir %attr(0700,root,root) %{_sysconfdir}/pki/akmods-keys/private
                  %attr(0644,root,root) %{_sysconfdir}/pki/akmods-keys/certs/public_key.der
                  %attr(0600,root,root) %{_sysconfdir}/pki/akmods-keys/private/private_key.priv
                  %config(noreplace) %{_sysconfdir}/rpm/macros.kmodtool
                mode: '0644'
                owner: root
                group: root

            - name: "Compile akmods-keys RPM package"
              ansible.builtin.command:
                cmd: rpmbuild -bb --define "_topdir /var/cache/akmods-keys-build" /var/cache/akmods-keys-build/SPECS/akmods-keys.spec
              register: akmods_keys_rpmbuild

        - name: "Find generated akmods-keys RPM"
          ansible.builtin.find:
            paths: /var/cache/akmods-keys-build/RPMS/noarch
            patterns: "akmods-keys-*.noarch.rpm"
          register: akmods_keys_rpm_files
          when:
            - akmods_keys_installed.rc != 0
            - "'akmods-keys' not in rpm_ostree_status_check.stdout"

        # 5. Layer NVIDIA Driver & akmods-keys Packages
        # When akmods-keys is newly built and akmod-nvidia was already layered, we trigger
        # a rebuild of akmod-nvidia within the new deployment so that modules are signed.
        - name: "Install akmods-keys and trigger signed module build in rpm-ostree"
          ansible.builtin.command:
            cmd: >
              rpm-ostree install --idempotent --unchanged-exit-77
              {% if akmod_nvidia_installed.rc == 0 %}
              --uninstall=akmod-nvidia
              {% for kmod_pkg in installed_kmod_pkgs.stdout_lines %}
              --uninstall={{ kmod_pkg }}
              {% endfor %}
              akmod-nvidia
              {% else %}
              {{ nvidia_packages | join(' ') }}
              {% endif %}
              {{ akmods_keys_rpm_files.files[0].path }}
          when:
            - akmods_keys_installed.rc != 0
            - "'akmods-keys' not in rpm_ostree_status_check.stdout"
            - akmods_keys_rpm_files is defined
            - akmods_keys_rpm_files.matched | default(0) > 0
          register: akmods_keys_install
          failed_when: akmods_keys_install.rc != 0 and akmods_keys_install.rc != 77
          changed_when: akmods_keys_install.rc == 0

        - name: "Ensure all NVIDIA driver packages are present via rpm-ostree"
          community.general.rpm_ostree_pkg:
            name: "{{ nvidia_packages }}"
            state: present
          register: nvidia_pkg_result

        # 6. User Guidance Notifications
        - name: "Notify MOK enrollment pending reboot"
          ansible.builtin.debug:
            msg:
              - "================================================================="
              - "AVISO SECURE BOOT: Chave MOK importada com sucesso!"
              - "Na próxima inicialização, a tela azul do MokManager solicitará a"
              - "senha temporária que você definiu para confirmar a inscrição."
              - "Após confirmar, o Secure Boot poderá ser ativado na BIOS/UEFI."
              - "================================================================="
          when: mok_import_result is changed

        - name: "Notify system reboot required"
          ansible.builtin.debug:
            msg:
              - "================================================================="
              - "AVISO: Módulos NVIDIA reconstruídos e assinados com a sua chave MOK!"
              - "Reinicie o computador ('systemctl reboot') para inicializar na nova deployment."
              - "Após o reboot, o driver NVIDIA carregará com aceleração total e Secure Boot ativo!"
              - "================================================================="
          when:
            - (akmods_keys_install is defined and akmods_keys_install is changed) or
              (nvidia_pkg_result is defined and nvidia_pkg_result.needs_reboot | default(false)) or
              (kargs_result is defined and kargs_result is changed) or
              (rpmfusion_install is defined and rpmfusion_install is changed)

    # 7. System Performance Tuning & Security Hardening (Modular Role)
    - name: "Include system_tuning role"
      ansible.builtin.include_role:
        name: system_tuning
      tags:
        - performance
        - security
        - sysctl

# ==============================================================================
# Play 2: User Configuration (Stateless DevOps Profile)
# Runs with standard user privileges (become: false).
# ==============================================================================
- name: "Setup Stateless DevOps"
  hosts: localhost
  connection: local
  gather_facts: true
  become: false
  tags:
    - user
    - dotfiles
    - brew
    - devpod
    - podman
  vars:
    # Modern syntax to avoid Warnings
    workspace_dir: "{{ ansible_facts['env']['HOME'] }}/Projects"
    dotfiles_dir: "{{ workspace_dir }}/dotfiles"

    # Git Identity
    git_name: "Ariel F."
    git_email: "50802265+ariel99gf@users.noreply.github.com"

    repositories:
      - { name: "homelab", url: "git@github.com:ariel99gf/homelab.git" }

  tasks:
    # 0. Container & Socket Infrastructure (Podman)
    - name: "Ensure Podman user socket is enabled and running"
      ansible.builtin.systemd:
        name: podman.socket
        scope: user
        state: started
        enabled: true
      environment:
        XDG_RUNTIME_DIR: "{{ ansible_facts['env']['XDG_RUNTIME_DIR'] | default('/run/user/' ~ ansible_facts['user_uid']) }}"
      tags:
        - podman
        - devpod

    # 1. SSH Configuration
    - name: "Ensure GitHub is in known_hosts"
      known_hosts:
        name: github.com
        key: "{{ lookup('pipe', 'ssh-keyscan github.com') }}"
        state: present

    - name: "Ensure repos subdirectory in Workspace"
      file:
        path: "{{ workspace_dir }}/repos"
        state: directory

    - name: "Ensure DevContainer mount directories exist"
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/{{ item }}"
        state: directory
        mode: '0700'
      loop:
        - ".aws"
        - ".config/sops"
      tags:
        - devpod

    # 4. Interface and Productivity Tools
    - name: "Install productivity tools on Host via Brew"
      shell: "brew install {{ item }}"
      loop:
        - tmux # Terminal Multiplexer
        - stow # Dotfile Manager
        - zoxide # Smarter cd
        - fzf # Fuzzy Finder
        - jq # JSON Processor
        - eza # Modern ls
        - bat # Modern cat
        - ripgrep # Fast grep
        - fd # Fast find
        - bitwarden-cli # CLI Password Manager
        - starship # Fast cross-shell prompt
        - lazygit # Simple terminal UI for git
        - lazydocker # Terminal UI for container management
        - mise # Polyglot runtime and tool manager
      register: brew_result
      changed_when: "'already installed' not in brew_result.stderr"

    # 4.1 DevPod (Linux Binary - Correct Method)
    - name: "Install DevPod via Direct Download"
      get_url:
        url: "https://github.com/loft-sh/devpod/releases/latest/download/devpod-linux-amd64"
        dest: "/home/linuxbrew/.linuxbrew/bin/devpod"
        mode: "0755"

    # 4.1.1 Configure DevPod Provider for Podman
    - name: "Check existing DevPod providers"
      ansible.builtin.command:
        cmd: devpod provider list
      register: devpod_providers_check
      failed_when: false
      changed_when: false
      tags:
        - devpod

    - name: "Add Docker provider to DevPod (if missing)"
      ansible.builtin.command:
        cmd: devpod provider add docker
      when: "'docker' not in devpod_providers_check.stdout"
      tags:
        - devpod

    - name: "Configure DevPod to use Podman binary"
      ansible.builtin.command:
        cmd: devpod provider set-options docker -o DOCKER_PATH=podman
      register: devpod_set_option
      changed_when: "'Successfully set' in devpod_set_option.stdout"
      tags:
        - devpod

    - name: "Set Docker (Podman) as default DevPod provider"
      ansible.builtin.command:
        cmd: devpod provider use docker
      register: devpod_use_docker
      changed_when: "'Successfully switched' in devpod_use_docker.stdout"
      tags:
        - devpod

    # 4.2 TPM (Tmux Plugin Manager)
    - name: "Install TPM (Tmux Plugin Manager)"
      git:
        repo: "https://github.com/tmux-plugins/tpm"
        dest: "{{ ansible_facts['env']['HOME'] }}/.tmux/plugins/tpm"

    # 5. GitOps - Cloning
    - name: "Clone repositories to Workspace/repos"
      git:
        repo: "{{ item.url }}"
        dest: "{{ workspace_dir }}/{{ item.name }}"
        accept_hostkey: yes
      with_items: "{{ repositories }}"
      register: git_clone_result
      ignore_errors: true

    - name: "Warn if cloning repositories failed (SSH key may not be in RAM)"
      ansible.builtin.debug:
        msg: "AVISO: Falha ao clonar ou atualizar repositórios Git (Permission denied). Lembre-se de rodar 'unlock-ssh' para carregar a chave SSH do Bitwarden na memória antes de executar o Ansible."
      when: git_clone_result is failed

    # 6. Global Git Configuration (Identity)
    - name: "Configure Git Identity"
      community.general.git_config:
        name: "{{ item.key }}"
        scope: global
        value: "{{ item.value }}"
      loop:
        - { key: "user.name", value: "{{ git_name }}" }
        - { key: "user.email", value: "{{ git_email }}" }
        - { key: "gpg.format", value: "ssh" }
        - { key: "commit.gpgsign", value: "true" } # Force global signing

    # 7. SSH Signing Automation (Detects key in RAM)
    - name: "Configure Git signing key (If available in RAM)"
      shell: |
        SSH_KEY=$(ssh-add -L 2>/dev/null | head -n1 | awk '{print $1, $2}')
        if [ -n "$SSH_KEY" ]; then
          git config --global user.signingkey "$SSH_KEY"
          echo "changed"
        else
          echo "skipped"
        fi
      register: git_signing
      changed_when: "'changed' in git_signing.stdout"
      ignore_errors: true

    # 7.5 Ensure .bashrc loads .bash_aliases
    - name: "Configure .bashrc to load aliases"
      lineinfile:
        path: "{{ ansible_facts['env']['HOME'] }}/.bashrc"
        line: "[ -f ~/.bash_aliases ] && . ~/.bash_aliases"
        state: present
        create: yes

    # 8. Dotfiles
    - name: "Check if .bash_aliases is already a symlink"
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.bash_aliases"
      register: bash_aliases_stat

    - name: "Prepare home directory for Stow (Remove conflicting regular file)"
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.bash_aliases"
        state: absent
      when: bash_aliases_stat.stat.exists and not bash_aliases_stat.stat.islnk

    - name: "Check if .ssh/config is already a symlink"
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.ssh/config"
      register: ssh_config_stat

    - name: "Prepare home directory for Stow (Remove conflicting regular file .ssh/config)"
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.ssh/config"
        state: absent
      when: ssh_config_stat.stat.exists and not ssh_config_stat.stat.islnk

    - name: "Apply dotfiles via GNU Stow"
      shell: "stow --dir={{ dotfiles_dir }} --target={{ ansible_facts['env']['HOME'] }} --restow {{ item }}"
      with_items:
        - "tmux"
        - "bash"
        - "starship"
        - "ssh"

    - name: "Enforce strict permissions on sensitive directories and files"
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/{{ item.path }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: ".ssh", mode: "0700" }
        - { path: ".ssh/config", mode: "0600" }
        - { path: ".aws", mode: "0700" }
        - { path: ".config/sops", mode: "0700" }
      failed_when: false
      tags:
        - security
        - permissions


# ==============================================================================
# Play 3: EUD System Configuration (Network UPS Tools)
# Runs with root privileges (become: true). Use -K (--ask-become-pass).
# ==============================================================================
- name: "EUD System - UPS Power Resilience (NUT)"
  hosts: localhost
  connection: local
  gather_facts: true
  become: true
  tags:
    - eud
    - nut
    - ups

  vars:
    # NUT driver for USB HID UPS devices (APC, CyberPower, SMS, Eaton, etc.)
    nut_driver: "usbhid-ups"
    nut_ups_name: "eud-ups"
    # Shutdown threshold: battery percentage to trigger graceful poweroff
    nut_battery_shutdown_pct: 20
    # NUT mode: standalone (single UPS, single machine)
    nut_mode: "standalone"

  tasks:
    - name: "Check if system is running Fedora Atomic (OSTree)"
      ansible.builtin.stat:
        path: /run/ostree-booted
      register: ostree_booted

    - name: "Install NUT (Network UPS Tools) via rpm-ostree"
      ansible.builtin.command:
        cmd: rpm-ostree install --idempotent --unchanged-exit-77 nut
      register: nut_install
      failed_when: nut_install.rc != 0 and nut_install.rc != 77
      changed_when: nut_install.rc == 0
      when: ostree_booted.stat.exists

    - name: "Check if SatDump COPR repo is configured"
      ansible.builtin.stat:
        path: /etc/yum.repos.d/_copr_derisis13-SatDump.repo
      register: satdump_copr_stat

    - name: "Download SatDump COPR repository file"
      ansible.builtin.get_url:
        url: "https://copr.fedorainfracloud.org/coprs/derisis13/SatDump/repo/fedora-{{ ansible_facts['distribution_major_version'] }}/derisis13-SatDump-fedora-{{ ansible_facts['distribution_major_version'] }}.repo"
        dest: /etc/yum.repos.d/_copr_derisis13-SatDump.repo
        owner: root
        group: root
        mode: '0644'
      when:
        - ostree_booted.stat.exists
        - not satdump_copr_stat.stat.exists
      register: satdump_copr_add

    - name: "Refresh rpm-ostree metadata after adding COPR"
      ansible.builtin.command:
        cmd: rpm-ostree refresh-md
      when: satdump_copr_add is changed

    - name: "Install SatDump via rpm-ostree (COPR)"
      ansible.builtin.command:
        cmd: rpm-ostree install --idempotent --unchanged-exit-77 SatDump
      register: satdump_install
      failed_when: satdump_install.rc != 0 and satdump_install.rc != 77
      changed_when: satdump_install.rc == 0
      when: ostree_booted.stat.exists

    - name: "Ensure nut system group exists (Fedora standard GID 57)"
      ansible.builtin.group:
        name: nut
        gid: 57
        system: true
        state: present

    - name: "Ensure nut system user exists (Fedora standard UID 57)"
      ansible.builtin.user:
        name: nut
        uid: 57
        group: nut
        system: true
        shell: /bin/false
        home: /run/nut
        create_home: false
        state: present

    - name: "Ensure NUT configuration directory exists"
      ansible.builtin.file:
        path: /etc/ups
        state: directory
        owner: root
        group: nut
        mode: '0750'

    - name: "Configure NUT mode (standalone)"
      ansible.builtin.copy:
        dest: /etc/ups/nut.conf
        content: |
          # Managed by Ansible (dotfiles/ansible/local/setup_pc.yml)
          MODE={{ nut_mode }}
        owner: root
        group: nut
        mode: '0640'

    - name: "Configure UPS driver (ups.conf)"
      ansible.builtin.copy:
        dest: /etc/ups/ups.conf
        content: |
          # Managed by Ansible (dotfiles/ansible/local/setup_pc.yml)
          # UPS connected via USB - auto-detected by usbhid-ups driver
          [{{ nut_ups_name }}]
              driver = {{ nut_driver }}
              port = auto
              desc = "No-break USB - Estação EUD"
              # Polling interval in seconds
              pollinterval = 15
        owner: root
        group: nut
        mode: '0640'

    - name: "Configure UPS monitor (upsmon.conf)"
      ansible.builtin.copy:
        dest: /etc/ups/upsmon.conf
        content: |
          # Managed by Ansible (dotfiles/ansible/local/setup_pc.yml)
          # Monitor the local UPS as primary (powerdown when battery critical)
          MONITOR {{ nut_ups_name }}@localhost 1 upsmon pass primary

          # Minimum number of power sources to stay running
          MINSUPPLIES 1

          # Shutdown command
          SHUTDOWNCMD "/usr/sbin/shutdown -h +0"

          # How often to poll (seconds)
          POLLFREQ 5
          POLLFREQALERT 5

          # Deadtime: seconds without contact before declaring UPS stale
          DEADTIME 15

          # Host synchronization timeout (standalone: 0 is fine)
          HOSTSYNC 15

          # Final delay before shutdown
          FINALDELAY 5

          # Notification flags: syslog + execute notifycmd
          NOTIFYFLAG ONLINE     SYSLOG+WALL
          NOTIFYFLAG ONBATT     SYSLOG+WALL+EXEC
          NOTIFYFLAG LOWBATT    SYSLOG+WALL+EXEC
          NOTIFYFLAG FSD        SYSLOG+WALL+EXEC
          NOTIFYFLAG SHUTDOWN   SYSLOG+WALL

          # Custom notification messages
          NOTIFYMSG ONLINE    "EUD: No-break com energia da rede (AC restaurado)"
          NOTIFYMSG ONBATT    "EUD: ALERTA - Operando na bateria do no-break!"
          NOTIFYMSG LOWBATT   "EUD: CRÍTICO - Bateria baixa, shutdown iminente!"
          NOTIFYMSG FSD       "EUD: Forced Shutdown - Desligamento de emergência!"
          NOTIFYMSG SHUTDOWN  "EUD: Sistema desligando para preservar dados."
        owner: root
        group: nut
        mode: '0640'

    - name: "Configure upssched for battery threshold shutdown"
      ansible.builtin.copy:
        dest: /etc/ups/upssched.conf
        content: |
          # Managed by Ansible (dotfiles/ansible/local/setup_pc.yml)
          CMDSCRIPT /usr/local/bin/eud-ups-handler.sh
          PIPEFN /run/nut/upssched.pipe
          LOCKFN /run/nut/upssched.lock

          # When on battery, start a timer; when back online, cancel it
          AT ONBATT * START-TIMER onbatt 30
          AT ONLINE * CANCEL-TIMER onbatt
          AT LOWBATT * EXECUTE lowbatt
          AT FSD * EXECUTE forced-shutdown
        owner: root
        group: nut
        mode: '0640'

    - name: "Deploy EUD UPS handler script"
      ansible.builtin.copy:
        dest: /usr/local/bin/eud-ups-handler.sh
        content: |
          #!/usr/bin/env bash
          # EUD UPS Handler - Managed by Ansible
          # Called by upssched when battery events occur

          case "$1" in
              onbatt)
                  # Check battery level from upsc
                  BATTERY_PCT=$(upsc {{ nut_ups_name }}@localhost battery.charge 2>/dev/null || echo "100")
                  if [ "${BATTERY_PCT}" -le {{ nut_battery_shutdown_pct }} ]; then
                      logger -t eud-ups "CRITICAL: Battery at ${BATTERY_PCT}% (<= {{ nut_battery_shutdown_pct }}%). Initiating graceful shutdown."
                      /usr/sbin/upsmon -c fsd
                  else
                      logger -t eud-ups "WARNING: On battery at ${BATTERY_PCT}%. Threshold: {{ nut_battery_shutdown_pct }}%."
                  fi
                  ;;
              lowbatt)
                  logger -t eud-ups "CRITICAL: Low battery signal from UPS. Forcing shutdown."
                  /usr/sbin/upsmon -c fsd
                  ;;
              forced-shutdown)
                  logger -t eud-ups "EMERGENCY: Forced Shutdown initiated."
                  ;;
              *)
                  logger -t eud-ups "Unknown event: $1"
                  ;;
          esac
        owner: root
        group: root
        mode: '0755'

    - name: "Check if NUT systemd services are available on booted deployment"
      ansible.builtin.stat:
        path: /usr/lib/systemd/system/nut-monitor.service
      register: nut_service_stat

    - name: "Enable and start NUT driver service"
      ansible.builtin.systemd:
        name: nut-driver-enumerator.service
        state: started
        enabled: true
      when: nut_service_stat.stat.exists
      failed_when: false

    - name: "Enable and start NUT monitor service"
      ansible.builtin.systemd:
        name: nut-monitor.service
        state: started
        enabled: true
      when: nut_service_stat.stat.exists
      failed_when: false

    - name: "Notify NUT reboot required (if newly installed)"
      ansible.builtin.debug:
        msg:
          - "================================================================="
          - "AVISO: NUT (Network UPS Tools) foi instalado via rpm-ostree."
          - "Reinicie o computador para ativar o pacote layered."
          - "Após o reboot, conecte o no-break USB e execute:"
          - "  sudo upsdrvctl start"
          - "  sudo systemctl start nut-driver-enumerator nut-monitor"
          - "  upsc {{ nut_ups_name }}@localhost"
          - "================================================================="
      when: nut_install is defined and nut_install is changed

# ==============================================================================
# Play 4: EUD User Services (Ollama, Flatpaks, TileServer GL)
# Runs with standard user privileges (become: false).
# ==============================================================================
- name: "EUD User Services - AI, Radio & Maps"
  hosts: localhost
  connection: local
  gather_facts: true
  become: false
  tags:
    - eud
    - ollama
    - flatpak
    - maps
    - sdr

  vars:
    user_home: "{{ ansible_facts['env']['HOME'] }}"
    xdg_runtime_dir: "{{ ansible_facts['env']['XDG_RUNTIME_DIR'] | default('/run/user/' ~ ansible_facts['user_uid']) }}"

    # Ollama configuration
    ollama_image: "docker.io/ollama/ollama:latest"
    ollama_container_name: "ollama"
    ollama_models_dir: "{{ user_home }}/.ollama/models"
    ollama_port: 11434
    ollama_default_model: "llama3:8b"

    # TileServer GL configuration
    tileserver_image: "docker.io/maptiler/tileserver-gl:latest"
    tileserver_container_name: "tileserver-gl"
    tileserver_data_dir: "{{ user_home }}/dados/maps"
    tileserver_port: 8080

    # Flatpak SDR/Radio/Maps applications
    flatpak_apps:
      - { id: "dk.gqrx.gqrx",            desc: "Gqrx SDR Receiver" }
      - { id: "com.chirpmyradio.chirp",    desc: "CHIRP (Programação HT)" }

  tasks:
    # ------------------------------------------------------------------
    # 1. Flatpak SDR/Radio Applications
    # ------------------------------------------------------------------
    - name: "Ensure Flathub remote is configured"
      ansible.builtin.command:
        cmd: flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      register: flathub_add
      changed_when: "'already exists' not in flathub_add.stderr"
      tags:
        - flatpak
        - sdr

    - name: "Install SDR/Radio Flatpak applications"
      community.general.flatpak:
        name: "{{ item.id }}"
        state: present
        method: system
      loop: "{{ flatpak_apps }}"
      loop_control:
        label: "{{ item.desc }}"
      tags:
        - flatpak
        - sdr

    - name: "Install QGIS (stable branch) via Flatpak"
      ansible.builtin.command:
        cmd: flatpak install --system --noninteractive flathub org.qgis.qgis//stable
      register: qgis_install
      failed_when: qgis_install.rc != 0 and 'already installed' not in qgis_install.stderr
      changed_when: qgis_install.rc == 0 and 'already installed' not in qgis_install.stderr
      tags:
        - flatpak
        - sdr

    # ------------------------------------------------------------------
    # 2. Ollama Local AI (Podman Rootless + Quadlet)
    # ------------------------------------------------------------------
    - name: "Ensure Ollama model storage directory exists"
      ansible.builtin.file:
        path: "{{ ollama_models_dir }}"
        state: directory
        mode: '0755'
      tags:
        - ollama

    - name: "Ensure systemd user containers directory exists"
      ansible.builtin.file:
        path: "{{ user_home }}/.config/containers/systemd"
        state: directory
        mode: '0755'
      tags:
        - ollama
        - maps

    - name: "Deploy Ollama Quadlet container unit"
      ansible.builtin.copy:
        dest: "{{ user_home }}/.config/containers/systemd/ollama.container"
        content: |
          # Managed by Ansible (dotfiles/ansible/local/setup_pc.yml)
          # Ollama Local AI - Quadlet Container Definition
          [Unit]
          Description=Ollama Local AI Server (EUD)
          After=default.target

          [Container]
          Image={{ ollama_image }}
          ContainerName={{ ollama_container_name }}
          PublishPort={{ ollama_port }}:11434
          Volume={{ ollama_models_dir }}:/root/.ollama:Z
          AutoUpdate=registry

          [Service]
          Restart=on-failure
          RestartSec=10
          TimeoutStartSec=300

          [Install]
          WantedBy=default.target
        mode: '0644'
      register: ollama_quadlet
      tags:
        - ollama

    - name: "Reload systemd user daemon (Ollama Quadlet)"
      ansible.builtin.systemd:
        daemon_reload: true
        scope: user
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
      when: ollama_quadlet is changed
      tags:
        - ollama

    - name: "Enable and start Ollama container service"
      ansible.builtin.systemd:
        name: ollama.service
        scope: user
        state: started
        enabled: true
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
      tags:
        - ollama

    - name: "Wait for Ollama API to be ready"
      ansible.builtin.uri:
        url: "http://localhost:{{ ollama_port }}/api/tags"
        method: GET
        status_code: 200
      register: ollama_health
      retries: 12
      delay: 10
      until: ollama_health.status == 200
      tags:
        - ollama

    - name: "Check if Ollama model {{ ollama_default_model }} is present"
      ansible.builtin.command:
        cmd: podman exec {{ ollama_container_name }} ollama list
      register: ollama_list
      changed_when: false
      tags:
        - ollama

    - name: "Pull default Ollama model ({{ ollama_default_model }})"
      ansible.builtin.command:
        cmd: podman exec {{ ollama_container_name }} ollama pull {{ ollama_default_model }}
      when: ollama_default_model not in ollama_list.stdout
      tags:
        - ollama

    # ------------------------------------------------------------------
    # 3. TileServer GL (Mapas Offline via Podman Quadlet)
    # ------------------------------------------------------------------
    - name: "Ensure TileServer GL data directory exists"
      ansible.builtin.file:
        path: "{{ tileserver_data_dir }}"
        state: directory
        mode: '0755'
      tags:
        - maps

    - name: "Deploy TileServer GL Quadlet container unit"
      ansible.builtin.copy:
        dest: "{{ user_home }}/.config/containers/systemd/tileserver-gl.container"
        content: |
          # Managed by Ansible (dotfiles/ansible/local/setup_pc.yml)
          # TileServer GL - Offline Maps Server (EUD)
          [Unit]
          Description=TileServer GL - Offline Maps (EUD)
          After=default.target

          [Container]
          Image={{ tileserver_image }}
          ContainerName={{ tileserver_container_name }}
          User=root
          PublishPort={{ tileserver_port }}:8080
          Volume={{ tileserver_data_dir }}:/data:Z
          AutoUpdate=registry

          [Service]
          Restart=on-failure
          RestartSec=10
          TimeoutStartSec=120

          [Install]
          WantedBy=default.target
        mode: '0644'
      register: tileserver_quadlet
      tags:
        - maps

    - name: "Reload systemd user daemon (TileServer Quadlet)"
      ansible.builtin.systemd:
        daemon_reload: true
        scope: user
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
      when: tileserver_quadlet is changed
      tags:
        - maps

    - name: "Enable and start TileServer GL container service"
      ansible.builtin.systemd:
        name: tileserver-gl.service
        scope: user
        state: started
        enabled: true
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
      tags:
        - maps
