---
# ==============================================================================
# Play 1: Host Configuration (NVIDIA Drivers & Secure Boot)
# Runs with root privileges (become: true). Use -K (--ask-become-pass).
# ==============================================================================
- name: "Host Configuration - NVIDIA Drivers & Secure Boot"
  hosts: localhost
  connection: local
  gather_facts: true
  become: true
  tags:
    - system
    - nvidia
    - sysctl
    - performance
    - security
    - firewall
    - chrony
    - time

  vars:
    # Kernel arguments required for NVIDIA proprietary driver
    nvidia_kargs:
      - "rd.driver.blacklist=nouveau,nova-core"
      - "modprobe.blacklist=nouveau,nova-core"
      - "nvidia-drm.modeset=1"

    # Layered packages for NVIDIA
    nvidia_packages:
      - akmod-nvidia
      - xorg-x11-drv-nvidia
      - xorg-x11-drv-nvidia-cuda

    # Optional MOK password from environment variable (empty by default)
    mok_enroll_password: "{{ lookup('env', 'MOK_ENROLL_PASSWORD') | default('', true) }}"

  tasks:
    - name: "Check if system is running Fedora Atomic (OSTree)"
      ansible.builtin.stat:
        path: /run/ostree-booted
      register: ostree_booted
      become: false
      tags:
        - system
        - nvidia
        - sysctl
        - performance
        - security
        - firewall
        - chrony
        - time

    - name: "Check for NVIDIA GPU hardware"
      ansible.builtin.shell: "lspci -nn | grep -iE 'vga|3d controller' | grep -i nvidia"
      register: nvidia_gpu_check
      failed_when: false
      changed_when: false
      become: false
      tags:
        - system
        - nvidia
        - sysctl
        - performance
        - security
        - firewall
        - chrony
        - time

    - name: "Manage NVIDIA & Secure Boot on Fedora Atomic"
      when:
        - ostree_booted.stat.exists
        - nvidia_gpu_check.rc == 0
      tags:
        - nvidia
        - secureboot
      block:
        # 1. RPM Fusion Repositories
        - name: "Check if RPM Fusion repository package is installed"
          ansible.builtin.command:
            cmd: rpm -q rpmfusion-nonfree-release
          register: rpmfusion_check
          failed_when: false
          changed_when: false

        - name: "Install RPM Fusion repositories via rpm-ostree"
          ansible.builtin.command:
            cmd: >
              rpm-ostree install --idempotent --unchanged-exit-77
              https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm
              https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm
          when: rpmfusion_check.rc != 0
          register: rpmfusion_install
          failed_when: rpmfusion_install.rc != 0 and rpmfusion_install.rc != 77
          changed_when: rpmfusion_install.rc == 0

        # 1.5 Ensure MOK key generation and RPM packaging tools are available on host
        - name: "Check if akmods and rpm-build tooling are already installed"
          ansible.builtin.command:
            cmd: rpm -q akmods rpm-build
          register: build_tools_check
          failed_when: false
          changed_when: false

        - name: "Ensure akmods and rpm-build tooling are available on host"
          ansible.builtin.command:
            cmd: rpm-ostree install --idempotent --unchanged-exit-77 -y akmods rpm-build
          when: build_tools_check.rc != 0
          register: build_tools_install
          failed_when: build_tools_install.rc != 0 and build_tools_install.rc != 77
          changed_when: build_tools_install.rc == 0

        # 2. Secure Boot - MOK Key Generation & Verification (Must precede driver build)
        - name: "Check if akmods MOK public key exists"
          ansible.builtin.stat:
            path: /etc/pki/akmods/certs/public_key.der
          register: mok_cert_stat

        - name: "Generate local MOK key pair if missing"
          ansible.builtin.command:
            cmd: kmodgenca -a
          when: not mok_cert_stat.stat.exists
          register: kmodgenca_result

        - name: "Check if MOK key is enrolled in UEFI"
          ansible.builtin.command:
            cmd: mokutil --test-key /etc/pki/akmods/certs/public_key.der
          register: mok_key_test
          failed_when: false
          changed_when: false

        - name: "Check if MOK key enrollment is already pending reboot"
          ansible.builtin.command:
            cmd: mokutil --list-new
          register: mok_list_new
          failed_when: false
          changed_when: false

        - name: "Prompt for temporary MOK enrollment password (if not enrolled or pending)"
          ansible.builtin.pause:
            prompt: "Digite uma senha temporária única para registrar a chave MOK no Secure Boot (usada na tela azul MokManager ao reiniciar)"
            echo: false
          register: mok_prompt_input
          when:
            - mok_key_test.rc != 0
            - mok_list_new.stdout | trim == ""
            - mok_enroll_password | length == 0
          no_log: true

        - name: "Stage MOK key enrollment in UEFI"
          ansible.builtin.shell: |
            printf "%s\n%s\n" "{{ effective_mok_pwd }}" "{{ effective_mok_pwd }}" | mokutil --import /etc/pki/akmods/certs/public_key.der
          vars:
            effective_mok_pwd: "{{ mok_enroll_password if (mok_enroll_password | length > 0) else (mok_prompt_input.user_input | default('')) }}"
          when:
            - mok_key_test.rc != 0
            - mok_list_new.stdout | trim == ""
            - effective_mok_pwd | length > 0
          no_log: true
          register: mok_import_result

        # 3. Kernel Arguments (kargs) - Configure required kargs & clean dangerous workarounds
        - name: "Configure kernel arguments for NVIDIA driver"
          ansible.builtin.command:
            cmd: >
              rpm-ostree kargs
              --delete-if-present=initcall_blacklist=simpledrm_platform_driver_init
              {% for arg in nvidia_kargs %}
              --append-if-missing={{ arg }}
              {% endfor %}
              --unchanged-exit-77
          register: kargs_result
          failed_when: kargs_result.rc != 0 and kargs_result.rc != 77
          changed_when: kargs_result.rc == 0

        # 4. Secure Boot - Package Local MOK Keys for rpm-ostree Compose Sandbox
        # On Fedora Atomic, rpm-ostree builds akmods in an isolated sandbox that cannot
        # see /etc/pki/akmods on the host. Packaging the keys into an RPM and deploying
        # them along with macros.kmodtool ensures all kmod builds are automatically signed.
        - name: "Check if akmods-keys package is already installed"
          ansible.builtin.command:
            cmd: rpm -q akmods-keys
          register: akmods_keys_installed
          failed_when: false
          changed_when: false

        - name: "Check rpm-ostree status for pending/staged deployments"
          ansible.builtin.command:
            cmd: rpm-ostree status
          register: rpm_ostree_status_check
          changed_when: false

        - name: "Check if akmod-nvidia is currently installed"
          ansible.builtin.command:
            cmd: rpm -q akmod-nvidia
          register: akmod_nvidia_installed
          failed_when: false
          changed_when: false

        - name: "Check for any existing local kmod-nvidia packages"
          ansible.builtin.shell: "rpm -qa 'kmod-nvidia*'"
          register: installed_kmod_pkgs
          failed_when: false
          changed_when: false

        - name: "Build akmods-keys RPM package locally"
          when:
            - akmods_keys_installed.rc != 0
            - "'akmods-keys' not in rpm_ostree_status_check.stdout"
          block:
            - name: "Create akmods-keys build directories"
              ansible.builtin.file:
                path: "{{ item }}"
                state: directory
                mode: '0700'
                owner: root
                group: root
              loop:
                - /var/cache/akmods-keys-build
                - /var/cache/akmods-keys-build/SOURCES
                - /var/cache/akmods-keys-build/SPECS
                - /var/cache/akmods-keys-build/BUILD
                - /var/cache/akmods-keys-build/RPMS
                - /var/cache/akmods-keys-build/SRPMS

            - name: "Copy local MOK certificates to RPM build sources"
              ansible.builtin.copy:
                src: "{{ item.src }}"
                dest: "{{ item.dest }}"
                remote_src: true
                mode: "{{ item.mode }}"
                owner: root
                group: root
              loop:
                - { src: "/etc/pki/akmods/certs/public_key.der", dest: "/var/cache/akmods-keys-build/SOURCES/public_key.der", mode: "0644" }
                - { src: "/etc/pki/akmods/private/private_key.priv", dest: "/var/cache/akmods-keys-build/SOURCES/private_key.priv", mode: "0600" }

            - name: "Create macros.kmodtool for akmods-keys"
              ansible.builtin.copy:
                dest: /var/cache/akmods-keys-build/SOURCES/macros.kmodtool
                content: |
                  # Configured by akmods-keys for rpm-ostree module signing
                  %_kmodtool_signmodules 1
                  %_kmodtool_signmodules_pubkey /etc/pki/akmods-keys/certs/public_key.der
                  %_kmodtool_signmodules_privkey /etc/pki/akmods-keys/private/private_key.priv
                mode: '0644'
                owner: root
                group: root

            - name: "Create akmods-keys RPM spec file"
              ansible.builtin.copy:
                dest: /var/cache/akmods-keys-build/SPECS/akmods-keys.spec
                content: |
                  Name:           akmods-keys
                  Version:        0.1
                  Release:        1%{?dist}
                  Summary:        Local akmods MOK keys for rpm-ostree kmod signing
                  License:        MIT
                  BuildArch:      noarch

                  %description
                  Local MOK keys and kmodtool configuration for rpm-ostree module signing.

                  %install
                  mkdir -p %{buildroot}%{_sysconfdir}/pki/akmods-keys/certs
                  mkdir -p %{buildroot}%{_sysconfdir}/pki/akmods-keys/private
                  mkdir -p %{buildroot}%{_sysconfdir}/rpm

                  install -m 0644 %{_sourcedir}/public_key.der %{buildroot}%{_sysconfdir}/pki/akmods-keys/certs/public_key.der
                  install -m 0600 %{_sourcedir}/private_key.priv %{buildroot}%{_sysconfdir}/pki/akmods-keys/private/private_key.priv
                  install -m 0644 %{_sourcedir}/macros.kmodtool %{buildroot}%{_sysconfdir}/rpm/macros.kmodtool

                  %files
                  %dir %{_sysconfdir}/pki/akmods-keys
                  %dir %attr(0755,root,root) %{_sysconfdir}/pki/akmods-keys/certs
                  %dir %attr(0700,root,root) %{_sysconfdir}/pki/akmods-keys/private
                  %attr(0644,root,root) %{_sysconfdir}/pki/akmods-keys/certs/public_key.der
                  %attr(0600,root,root) %{_sysconfdir}/pki/akmods-keys/private/private_key.priv
                  %config(noreplace) %{_sysconfdir}/rpm/macros.kmodtool
                mode: '0644'
                owner: root
                group: root

            - name: "Compile akmods-keys RPM package"
              ansible.builtin.command:
                cmd: rpmbuild -bb --define "_topdir /var/cache/akmods-keys-build" /var/cache/akmods-keys-build/SPECS/akmods-keys.spec
              register: akmods_keys_rpmbuild

        - name: "Find generated akmods-keys RPM"
          ansible.builtin.find:
            paths: /var/cache/akmods-keys-build/RPMS/noarch
            patterns: "akmods-keys-*.noarch.rpm"
          register: akmods_keys_rpm_files
          when:
            - akmods_keys_installed.rc != 0
            - "'akmods-keys' not in rpm_ostree_status_check.stdout"

        # 5. Layer NVIDIA Driver & akmods-keys Packages
        # When akmods-keys is newly built and akmod-nvidia was already layered, we trigger
        # a rebuild of akmod-nvidia within the new deployment so that modules are signed.
        - name: "Install akmods-keys and trigger signed module build in rpm-ostree"
          ansible.builtin.command:
            cmd: >
              rpm-ostree install --idempotent --unchanged-exit-77
              {% if akmod_nvidia_installed.rc == 0 %}
              --uninstall=akmod-nvidia
              {% for kmod_pkg in installed_kmod_pkgs.stdout_lines %}
              --uninstall={{ kmod_pkg }}
              {% endfor %}
              akmod-nvidia
              {% else %}
              {{ nvidia_packages | join(' ') }}
              {% endif %}
              {{ akmods_keys_rpm_files.files[0].path }}
          when:
            - akmods_keys_installed.rc != 0
            - "'akmods-keys' not in rpm_ostree_status_check.stdout"
            - akmods_keys_rpm_files is defined
            - akmods_keys_rpm_files.matched | default(0) > 0
          register: akmods_keys_install
          failed_when: akmods_keys_install.rc != 0 and akmods_keys_install.rc != 77
          changed_when: akmods_keys_install.rc == 0

        - name: "Ensure all NVIDIA driver packages are present via rpm-ostree"
          community.general.rpm_ostree_pkg:
            name: "{{ nvidia_packages }}"
            state: present
          when: akmod_nvidia_installed.rc != 0
          register: nvidia_pkg_result

        # 6. User Guidance Notifications
        - name: "Notify MOK enrollment pending reboot"
          ansible.builtin.debug:
            msg:
              - "================================================================="
              - "AVISO SECURE BOOT: Chave MOK importada com sucesso!"
              - "Na próxima inicialização, a tela azul do MokManager solicitará a"
              - "senha temporária que você definiu para confirmar a inscrição."
              - "Após confirmar, o Secure Boot poderá ser ativado na BIOS/UEFI."
              - "================================================================="
          when: mok_import_result is changed

        - name: "Notify system reboot required"
          ansible.builtin.debug:
            msg:
              - "================================================================="
              - "AVISO: Módulos NVIDIA reconstruídos e assinados com a sua chave MOK!"
              - "Reinicie o computador ('systemctl reboot') para inicializar na nova deployment."
              - "Após o reboot, o driver NVIDIA carregará com aceleração total e Secure Boot ativo!"
              - "================================================================="
          when:
            - (akmods_keys_install is defined and akmods_keys_install is changed) or
              (nvidia_pkg_result is defined and nvidia_pkg_result.needs_reboot | default(false)) or
              (kargs_result is defined and kargs_result is changed) or
              (rpmfusion_install is defined and rpmfusion_install is changed)

    # 7. System Performance Tuning & Security Hardening (Modular Role)
    - name: "Include system_tuning role"
      ansible.builtin.include_role:
        name: system_tuning
        apply:
          tags:
            - performance
            - security
            - sysctl
      tags:
        - performance
        - security
        - sysctl

    - name: "Flush handlers to apply sysctl and systemd-resolved immediately"
      ansible.builtin.meta: flush_handlers
      tags:
        - performance
        - security
        - sysctl

    # 8. Firewall Hardening (firewalld)
    - name: "Ensure firewalld is enabled and running"
      ansible.builtin.systemd:
        name: firewalld
        state: started
        enabled: true
      tags:
        - security
        - firewall

    - name: "Get list of enabled services in public firewalld zone"
      ansible.builtin.command:
        cmd: firewall-cmd --zone=public --list-services
      register: firewalld_public_services
      changed_when: false
      failed_when: false
      tags:
        - security
        - firewall

    - name: "Remove ssh service from public firewalld zone (Stealth Workstation)"
      ansible.builtin.command:
        cmd: firewall-cmd --permanent --zone=public --remove-service=ssh
      when:
        - firewalld_public_services.rc == 0
        - "'ssh' in firewalld_public_services.stdout"
      register: firewalld_ssh_removed
      tags:
        - security
        - firewall

    - name: "Reload firewalld configuration"
      ansible.builtin.command:
        cmd: firewall-cmd --reload
      when:
        - firewalld_ssh_removed is defined
        - firewalld_ssh_removed is changed
      tags:
        - security
        - firewall

    # 9. Time Synchronization & RTC Hardening (NTP.br & Hardware UTC)
    - name: "Ensure timezone is America/Sao_Paulo and hardware clock (RTC) is UTC"
      community.general.timezone:
        name: America/Sao_Paulo
        hwclock: UTC
      tags:
        - system
        - time
        - security

    - name: "Deploy resilient Chrony configuration (NTP.br, Anycast & Direct IP fallbacks)"
      ansible.builtin.copy:
        dest: /etc/chrony.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          # ==============================================================================
          # /etc/chrony.conf - Managed by Ansible (SRE High-Resilience Time Policy)
          # ==============================================================================

          # NTP.br - Observatório Nacional & NIC.br (Stratum 1)
          pool pool.ntp.br iburst
          server a.st1.ntp.br iburst
          server b.st1.ntp.br iburst
          server c.st1.ntp.br iburst
          server gps.ntp.br iburst

          # Global Anycast Stratum 1 Fallback (DNSSEC authenticated)
          server time.cloudflare.com iburst
          server time.google.com iburst

          # Direct Numeric IP Fallbacks (a.st1.ntp.br, b.st1.ntp.br, cloudflare, google)
          server 200.160.7.186 iburst
          server 200.189.40.8 iburst
          server 162.159.200.1 iburst
          server 216.239.35.0 iburst

          # DHCP NTP sources if provided
          sourcedir /run/chrony-dhcp

          # Drift and stepping
          driftfile /var/lib/chrony/drift
          makestep 1.0 3

          # Kernel real-time clock synchronization (RTC)
          rtcsync

          ntsdumpdir /var/lib/chrony
          leapseclist /usr/share/zoneinfo/leap-seconds.list
          logdir /var/log/chrony
      register: chrony_config_deploy
      tags:
        - system
        - time
        - security

    - name: "Ensure chronyd service is enabled and started"
      ansible.builtin.systemd:
        name: chronyd
        state: started
        enabled: true
      tags:
        - system
        - time
        - security

    - name: "Restart chronyd if configuration changed"
      ansible.builtin.systemd:
        name: chronyd
        state: restarted
      when: chrony_config_deploy is changed
      tags:
        - system
        - time
        - security

    - name: "Force immediate NTP time step"
      ansible.builtin.command:
        cmd: chronyc -a makestep
      changed_when: false
      failed_when: false
      tags:
        - system
        - time
        - security

    - name: "Synchronize system time to hardware clock (RTC in UTC)"
      ansible.builtin.command:
        cmd: hwclock --systohc --utc
      changed_when: false
      failed_when: false
      tags:
        - system
        - time
        - security

# ==============================================================================
# Play 2: User Configuration (Stateless DevOps Profile)
# Runs with standard user privileges (become: false).
# ==============================================================================
- name: "Setup Stateless DevOps"
  hosts: localhost
  connection: local
  gather_facts: true
  become: false
  tags:
    - user
    - dotfiles
    - brew
    - devpod
    - podman
    - distrobox
    - sre
  vars:
    # Modern syntax to avoid Warnings
    user_home: "{{ lookup('env', 'HOME') }}"
    workspace_dir: "{{ user_home }}/Projects"
    dotfiles_dir: "{{ workspace_dir }}/dotfiles"

    # Git Identity
    git_name: "Ariel F."
    git_email: "50802265+ariel99gf@users.noreply.github.com"

    repositories:
      - { name: "homelab", url: "git@github.com:ariel99gf/homelab.git" }

  tasks:
    # 0. Container & Socket Infrastructure (Podman)
    - name: "Ensure Podman user socket is enabled and running"
      ansible.builtin.systemd:
        name: podman.socket
        scope: user
        state: started
        enabled: true
      environment:
        XDG_RUNTIME_DIR: "{{ lookup('env', 'XDG_RUNTIME_DIR') | default('/run/user/' ~ lookup('pipe', 'id -u'), true) }}"
      tags:
        - podman
        - devpod

    # 1. SSH Configuration
    - name: "Ensure GitHub is in known_hosts"
      known_hosts:
        name: github.com
        key: "{{ lookup('pipe', 'ssh-keyscan github.com') }}"
        state: present

    - name: "Ensure repos subdirectory in Workspace"
      file:
        path: "{{ workspace_dir }}/repos"
        state: directory

    - name: "Ensure DevContainer mount directories exist"
      ansible.builtin.file:
        path: "{{ user_home }}/{{ item }}"
        state: directory
        mode: '0700'
      loop:
        - ".aws"
        - ".config/sops"
      tags:
        - devpod

    # 4. Minimal Essential Bootstrap Tools on Host (Hardened & Minimalist)
    - name: "Install minimal essential bootstrap tools on Host via Brew"
      shell: "brew install {{ item }}"
      loop:
        - stow          # Dotfile Symlink Manager
        - distrobox     # Containerized Environment Manager
        - mise          # Task and Orchestration Manager
        - bitwarden-cli # CLI Password Manager (SSH key management)
        - jq            # JSON Processor
        - tmux          # Terminal Multiplexer
      register: brew_install_result
      changed_when: "'already installed' not in brew_install_result.stderr"

    - name: "Purge non-essential productivity and dev tools from Host Brew"
      shell: "brew uninstall --ignore-dependencies {{ item }} 2>/dev/null || true"
      loop:
        - eza
        - bat
        - zoxide
        - lazygit
        - lazydocker
        - fd
        - ripgrep
        - nmap
        - pipx
        - gh
        - fzf
        - starship
      register: brew_purge_result
      changed_when: "'Uninstalling' in brew_purge_result.stdout"

    - name: "Run Homebrew autoremove and cleanup on Host"
      shell: "brew autoremove -q && brew cleanup -q"
      changed_when: false

    # 4.1 DevPod (Linux Binary - Correct Method)
    - name: "Install DevPod via Direct Download"
      get_url:
        url: "https://github.com/loft-sh/devpod/releases/latest/download/devpod-linux-amd64"
        dest: "/home/linuxbrew/.linuxbrew/bin/devpod"
        mode: "0755"

    # 4.1.1 Configure DevPod Provider for Podman
    - name: "Check existing DevPod providers"
      ansible.builtin.command:
        cmd: devpod provider list
      register: devpod_providers_check
      failed_when: false
      changed_when: false
      tags:
        - devpod

    - name: "Add Docker provider to DevPod (if missing)"
      ansible.builtin.command:
        cmd: devpod provider add docker
      when: "'docker' not in devpod_providers_check.stdout"
      tags:
        - devpod

    - name: "Configure DevPod to use Podman binary"
      ansible.builtin.command:
        cmd: devpod provider set-options docker -o DOCKER_PATH=podman
      register: devpod_set_option
      changed_when: "'Successfully set' in devpod_set_option.stdout"
      tags:
        - devpod

    - name: "Set Docker (Podman) as default DevPod provider"
      ansible.builtin.command:
        cmd: devpod provider use docker
      register: devpod_use_docker
      changed_when: "'Successfully switched' in devpod_use_docker.stdout"
      tags:
        - devpod

    # 4.2 TPM (Tmux Plugin Manager)
    - name: "Install TPM (Tmux Plugin Manager)"
      git:
        repo: "https://github.com/tmux-plugins/tpm"
        dest: "{{ user_home }}/.tmux/plugins/tpm"

    # 5. GitOps - Cloning
    - name: "Clone repositories to Workspace/repos"
      git:
        repo: "{{ item.url }}"
        dest: "{{ workspace_dir }}/{{ item.name }}"
        accept_hostkey: yes
      with_items: "{{ repositories }}"
      register: git_clone_result
      ignore_errors: true

    - name: "Warn if cloning repositories failed (SSH key may not be in RAM)"
      ansible.builtin.debug:
        msg: "AVISO: Falha ao clonar ou atualizar repositórios Git (Permission denied). Lembre-se de rodar 'unlock-ssh' para carregar a chave SSH do Bitwarden na memória antes de executar o Ansible."
      when: git_clone_result is failed

    # 6. Global Git Configuration (Identity)
    - name: "Configure Git Identity"
      community.general.git_config:
        name: "{{ item.key }}"
        scope: global
        value: "{{ item.value }}"
      loop:
        - { key: "user.name", value: "{{ git_name }}" }
        - { key: "user.email", value: "{{ git_email }}" }
        - { key: "gpg.format", value: "ssh" }
        - { key: "commit.gpgsign", value: "true" } # Force global signing

    # 7. SSH Signing Automation (Detects key in RAM)
    - name: "Configure Git signing key (If available in RAM)"
      shell: |
        SSH_KEY=$(ssh-add -L 2>/dev/null | grep -E '^ssh-(ed25519|rsa|ecdsa)' | head -n1 | awk '{print $1, $2}')
        if [ -n "$SSH_KEY" ]; then
          git config --global user.signingkey "$SSH_KEY"
          echo "changed"
        else
          git config --global --unset user.signingkey 2>/dev/null || true
          echo "skipped"
        fi
      register: git_signing
      changed_when: "'changed' in git_signing.stdout"
      ignore_errors: true

    # 7.4 Ensure .bashrc loads Homebrew defensively (ignored inside Distrobox/containers)
    - name: "Remove legacy unconditional Homebrew load from .bashrc"
      ansible.builtin.lineinfile:
        path: "{{ user_home }}/.bashrc"
        line: 'eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"'
        state: absent

    - name: "Configure .bashrc to load Homebrew defensively"
      ansible.builtin.lineinfile:
        path: "{{ user_home }}/.bashrc"
        line: '[ -x /home/linuxbrew/.linuxbrew/bin/brew ] && eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"'
        state: present
        create: yes

    # 7.5 Ensure .bashrc loads .bash_aliases
    - name: "Configure .bashrc to load aliases"
      lineinfile:
        path: "{{ user_home }}/.bashrc"
        line: "[ -f ~/.bash_aliases ] && . ~/.bash_aliases"
        state: present
        create: yes

    # 8. Dotfiles
    - name: "Check if .bash_aliases is already a symlink"
      ansible.builtin.stat:
        path: "{{ user_home }}/.bash_aliases"
      register: bash_aliases_stat

    - name: "Prepare home directory for Stow (Remove conflicting regular file .bash_aliases)"
      ansible.builtin.file:
        path: "{{ user_home }}/.bash_aliases"
        state: absent
      when: bash_aliases_stat.stat.exists and not bash_aliases_stat.stat.islnk

    - name: "Check if .ssh/config is already a symlink"
      ansible.builtin.stat:
        path: "{{ user_home }}/.ssh/config"
      register: ssh_config_stat

    - name: "Prepare home directory for Stow (Remove conflicting regular file .ssh/config)"
      ansible.builtin.file:
        path: "{{ user_home }}/.ssh/config"
        state: absent
      when: ssh_config_stat.stat.exists and not ssh_config_stat.stat.islnk

    - name: "Check if COSMIC files are already symlinks"
      ansible.builtin.stat:
        path: "{{ user_home }}/{{ item }}"
      register: cosmic_files_stat
      loop:
        - ".config/cosmic/com.system76.CosmicComp/v1/autotile"
        - ".config/cosmic/com.system76.CosmicTerm/v1/font_name"
      tags:
        - dotfiles
        - visual
        - cosmic
        - omakase

    - name: "Prepare home directory for Stow (Remove conflicting regular COSMIC files)"
      ansible.builtin.file:
        path: "{{ item.stat.path }}"
        state: absent
      when: item.stat.exists and not item.stat.islnk
      loop: "{{ cosmic_files_stat.results }}"
      tags:
        - dotfiles
        - visual
        - cosmic
        - omakase

    - name: "Apply dotfiles via GNU Stow"
      shell: "stow --dir={{ dotfiles_dir }} --target={{ user_home }} --restow {{ item }}"
      with_items:
        - "tmux"
        - "bash"
        - "starship"
        - "nvim"
        - "ssh"
        - "cosmic"
        - "scripts"
      tags:
        - dotfiles
        - visual
        - cosmic
        - omakase

    - name: "Enforce strict permissions on sensitive directories and files"
      ansible.builtin.file:
        path: "{{ user_home }}/{{ item.path }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: ".ssh", mode: "0700" }
        - { path: ".ssh/config", mode: "0600" }
        - { path: ".aws", mode: "0700" }
        - { path: ".config/sops", mode: "0700" }
      failed_when: false
      tags:
        - security
        - permissions

    - name: "Ensure Tmux Plugin Manager (TPM) is installed"
      ansible.builtin.git:
        repo: "https://github.com/tmux-plugins/tpm"
        dest: "{{ user_home }}/.tmux/plugins/tpm"
        version: master
        depth: 1
      failed_when: false

    - name: "Install Tmux plugins via TPM"
      ansible.builtin.command:
        cmd: "{{ user_home }}/.tmux/plugins/tpm/bin/install_plugins"
      failed_when: false
      changed_when: false

    # 8.5 Antigravity CLI Local Availability
    - name: "Ensure ~/.local/bin directory exists"
      ansible.builtin.file:
        path: "{{ user_home }}/.local/bin"
        state: directory
        mode: '0755'

    - name: "Check if antigravity-cli is installed via Homebrew"
      ansible.builtin.stat:
        path: "/home/linuxbrew/.linuxbrew/bin/antigravity"
      register: brew_antigravity_stat

    - name: "Ensure antigravity and agy are linked in ~/.local/bin"
      ansible.builtin.file:
        src: "/home/linuxbrew/.linuxbrew/bin/antigravity"
        dest: "{{ user_home }}/.local/bin/{{ item }}"
        state: link
        force: true
      loop:
        - antigravity
        - agy
      when: brew_antigravity_stat.stat.exists

    # 8.6 Omakase Visual Layer - Typography (JetBrainsMono Nerd Font)
    - name: "Ensure fonts directory exists in user space"
      ansible.builtin.file:
        path: "{{ user_home }}/.local/share/fonts"
        state: directory
        mode: '0755'
      tags:
        - visual
        - fonts
        - omakase

    - name: "Check if JetBrainsMono Nerd Font is installed"
      ansible.builtin.stat:
        path: "{{ user_home }}/.local/share/fonts/JetBrainsMonoNerdFont-Regular.ttf"
      register: jb_font_stat
      tags:
        - visual
        - fonts
        - omakase

    - name: "Download and extract JetBrainsMono Nerd Font"
      ansible.builtin.unarchive:
        src: "https://github.com/ryanoasis/nerd-fonts/releases/download/v3.3.0/JetBrainsMono.tar.xz"
        dest: "{{ user_home }}/.local/share/fonts"
        remote_src: true
        mode: '0644'
      when: not jb_font_stat.stat.exists
      register: font_install
      tags:
        - visual
        - fonts
        - omakase

    - name: "Update font cache"
      ansible.builtin.command:
        cmd: "fc-cache -fv {{ user_home }}/.local/share/fonts"
      when: font_install is changed
      tags:
        - visual
        - fonts
        - omakase

    # 8.7 Omakase Theme Initialization
    - name: "Initialize default Omakase theme"
      ansible.builtin.command:
        cmd: "{{ user_home }}/.local/bin/theme-switch tokyonight"
      args:
        creates: "{{ user_home }}/.config/omakase_theme"
      tags:
        - visual
        - theme
        - omakase

    # --------------------------------------------------------------------------
    # 9. Distrobox SRE / DevOps / Platform Engineering Sandbox
    # --------------------------------------------------------------------------
    - name: "Ensure SRE Distrobox provisioning script is executable"
      ansible.builtin.file:
        path: "{{ dotfiles_dir }}/distrobox/provision-sre.sh"
        mode: '0755'
      tags:
        - distrobox
        - devops
        - sre

    - name: "Check if SRE Distrobox container already exists"
      ansible.builtin.command:
        cmd: distrobox list
      register: distrobox_list_check
      changed_when: false
      tags:
        - distrobox
        - devops
        - sre

    - name: "Assemble SRE Distrobox container (if missing)"
      ansible.builtin.command:
        cmd: distrobox assemble create --file {{ dotfiles_dir }}/distrobox/distrobox.ini
      when: "'sre-toolbox' not in distrobox_list_check.stdout"
      register: distrobox_assemble_result
      tags:
        - distrobox
        - devops
        - sre

# ==============================================================================
# Play 3: EUD System Configuration (Network UPS Tools)
# Runs with root privileges (become: true). Use -K (--ask-become-pass).
# ==============================================================================
- name: "EUD System - Radio & Satellite Tools (SatDump)"
  hosts: localhost
  connection: local
  gather_facts: true
  become: true
  tags:
    - eud
    - satdump
    - sdr

  tasks:
    - name: "Check if system is running Fedora Atomic (OSTree)"
      ansible.builtin.stat:
        path: /run/ostree-booted
      register: ostree_booted

    - name: "Check if SatDump COPR repo is configured"
      ansible.builtin.stat:
        path: /etc/yum.repos.d/_copr_derisis13-SatDump.repo
      register: satdump_copr_stat

    - name: "Download SatDump COPR repository file"
      ansible.builtin.get_url:
        url: "https://copr.fedorainfracloud.org/coprs/derisis13/SatDump/repo/fedora-{{ ansible_facts['distribution_major_version'] }}/derisis13-SatDump-fedora-{{ ansible_facts['distribution_major_version'] }}.repo"
        dest: /etc/yum.repos.d/_copr_derisis13-SatDump.repo
        owner: root
        group: root
        mode: '0644'
      when:
        - ostree_booted.stat.exists
        - not satdump_copr_stat.stat.exists
      register: satdump_copr_add

    - name: "Refresh rpm-ostree metadata after adding COPR"
      ansible.builtin.command:
        cmd: rpm-ostree refresh-md
      when: satdump_copr_add is changed

    - name: "Install SatDump via rpm-ostree (COPR)"
      ansible.builtin.command:
        cmd: rpm-ostree install --idempotent --unchanged-exit-77 SatDump
      register: satdump_install
      failed_when: satdump_install.rc != 0 and satdump_install.rc != 77
      changed_when: satdump_install.rc == 0
      when: ostree_booted.stat.exists


# ==============================================================================
# Play 4: EUD User Services (Ollama, Flatpaks, TileServer GL)
# Runs with standard user privileges (become: false).
# ==============================================================================
- name: "EUD User Services - AI, Radio & Maps"
  hosts: localhost
  connection: local
  gather_facts: true
  become: false
  tags:
    - eud
    - ollama
    - flatpak
    - maps
    - sdr

  vars:
    user_home: "{{ lookup('env', 'HOME') }}"
    xdg_runtime_dir: "{{ lookup('env', 'XDG_RUNTIME_DIR') | default('/run/user/' ~ lookup('pipe', 'id -u'), true) }}"

    # Ollama configuration
    ollama_image: "docker.io/ollama/ollama:latest"
    ollama_container_name: "ollama"
    ollama_models_dir: "{{ user_home }}/.ollama/models"
    ollama_port: 11434
    ollama_default_model: "llama3:8b"

    # Bitcoin Core & Electrs configuration
    bitcoin_image: "docker.io/ruimarinho/bitcoin-core:28"
    electrs_image: "docker.io/getumbrel/electrs:v0.10.6"
    bitcoin_data_dir: "/var/mnt/bitcoin-data/bitcoind"
    electrs_data_dir: "/var/mnt/bitcoin-data/electrs"
    bitcoin_dbcache: 2048

    # Flatpak SDR/Radio/Maps applications
    flatpak_apps:
      - { id: "dk.gqrx.gqrx",            desc: "Gqrx SDR Receiver" }
      - { id: "com.chirpmyradio.chirp",    desc: "CHIRP (Programação HT)" }

  tasks:
    # ------------------------------------------------------------------
    # 1. Flatpak SDR/Radio Applications
    # ------------------------------------------------------------------
    - name: "Ensure Flathub remote is configured"
      ansible.builtin.command:
        cmd: flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      register: flathub_add
      changed_when: "'already exists' not in flathub_add.stderr"
      tags:
        - flatpak
        - sdr

    - name: "Install SDR/Radio Flatpak applications"
      community.general.flatpak:
        name: "{{ item.id }}"
        state: present
        method: system
      loop: "{{ flatpak_apps }}"
      loop_control:
        label: "{{ item.desc }}"
      tags:
        - flatpak
        - sdr

    - name: "Install QGIS (stable branch) via Flatpak"
      ansible.builtin.command:
        cmd: flatpak install --system --noninteractive flathub org.qgis.qgis//stable
      register: qgis_install
      failed_when: qgis_install.rc != 0 and 'already installed' not in qgis_install.stderr
      changed_when: qgis_install.rc == 0 and 'already installed' not in qgis_install.stderr
      tags:
        - flatpak
        - sdr

    # ------------------------------------------------------------------
    # 1.1 Desktop GPU Acceleration & Browser Decoding (Flatpak)
    # ------------------------------------------------------------------
    - name: "Detect host NVIDIA driver version"
      ansible.builtin.command:
        cmd: nvidia-smi --query-gpu=driver_version --format=csv,noheader
      register: host_nvidia_driver_check
      changed_when: false
      failed_when: false
      tags:
        - flatpak
        - gpu
        - performance

    - name: "Ensure Flatpak NVIDIA GL runtimes match host driver"
      ansible.builtin.command:
        cmd: "flatpak install --system --noninteractive flathub org.freedesktop.Platform.GL.nvidia-{{ host_nvidia_driver_check.stdout.strip() | regex_replace('\\.', '-') }} org.freedesktop.Platform.GL32.nvidia-{{ host_nvidia_driver_check.stdout.strip() | regex_replace('\\.', '-') }} org.freedesktop.Platform.VAAPI.nvidia"
      register: flatpak_nvidia_install
      changed_when: "'Installing' in flatpak_nvidia_install.stdout"
      failed_when: false
      when: host_nvidia_driver_check.rc == 0 and host_nvidia_driver_check.stdout.strip() != ""
      tags:
        - flatpak
        - gpu
        - performance

    - name: "Ensure Brave Flatpak config directory exists"
      ansible.builtin.file:
        path: "{{ user_home }}/.var/app/com.brave.Browser/config"
        state: directory
        mode: '0755'
      tags:
        - flatpak
        - brave
        - gpu

    - name: "Deploy Brave GPU hardware acceleration flags"
      ansible.builtin.copy:
        dest: "{{ user_home }}/.var/app/com.brave.Browser/config/brave-flags.conf"
        content: |
          --ozone-platform-hint=auto
          --enable-features=VaapiVideoDecodeLinuxGL,VaapiVideoDecoder,CanvasOopRasterization
          --enable-gpu-rasterization
          --enable-zero-copy
          --ignore-gpu-blocklist
        mode: '0644'
      tags:
        - flatpak
        - brave
        - gpu

    - name: "Configure Brave Flatpak DRI device permissions"
      ansible.builtin.command:
        cmd: flatpak override --user --device=dri com.brave.Browser
      register: brave_flatpak_override
      changed_when: false
      failed_when: false
      tags:
        - flatpak
        - brave
        - gpu

    # ------------------------------------------------------------------
    # 2. Ollama Local AI (Podman Rootless + Quadlet)
    # ------------------------------------------------------------------
    - name: "Ensure Ollama model storage directory exists"
      ansible.builtin.file:
        path: "{{ ollama_models_dir }}"
        state: directory
        mode: '0755'
      tags:
        - ollama

    - name: "Ensure systemd user containers directory exists"
      ansible.builtin.file:
        path: "{{ user_home }}/.config/containers/systemd"
        state: directory
        mode: '0755'
      tags:
        - ollama
        - maps

    - name: "Deploy Ollama Quadlet container unit"
      ansible.builtin.copy:
        dest: "{{ user_home }}/.config/containers/systemd/ollama.container"
        content: |
          # Managed by Ansible (dotfiles/ansible/local/setup_pc.yml)
          # Ollama Local AI - Quadlet Container Definition
          [Unit]
          Description=Ollama Local AI Server (EUD)
          After=default.target

          [Container]
          Image={{ ollama_image }}
          ContainerName={{ ollama_container_name }}
          PublishPort=127.0.0.1:{{ ollama_port }}:11434
          Volume={{ ollama_models_dir }}:/root/.ollama:Z
          AutoUpdate=registry

          [Service]
          Restart=on-failure
          RestartSec=10
          TimeoutStartSec=300

          [Install]
          WantedBy=default.target
        mode: '0644'
      register: ollama_quadlet
      tags:
        - ollama

    - name: "Reload systemd user daemon (Ollama Quadlet)"
      ansible.builtin.systemd:
        daemon_reload: true
        scope: user
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
      when: ollama_quadlet is changed
      tags:
        - ollama

    - name: "Restart Ollama container service if quadlet changed"
      ansible.builtin.systemd:
        name: ollama.service
        scope: user
        state: restarted
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
      when: ollama_quadlet is changed
      tags:
        - ollama

    - name: "Enable and start Ollama container service"
      ansible.builtin.systemd:
        name: ollama.service
        scope: user
        state: started
        enabled: true
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
      tags:
        - ollama

    - name: "Wait for Ollama API to be ready"
      ansible.builtin.uri:
        url: "http://localhost:{{ ollama_port }}/api/tags"
        method: GET
        status_code: 200
      register: ollama_health
      retries: 12
      delay: 10
      until: ollama_health.status == 200
      tags:
        - ollama

    - name: "Check if Ollama model {{ ollama_default_model }} is present"
      ansible.builtin.command:
        cmd: podman exec {{ ollama_container_name }} ollama list
      register: ollama_list
      changed_when: false
      tags:
        - ollama

    - name: "Pull default Ollama model ({{ ollama_default_model }})"
      ansible.builtin.command:
        cmd: podman exec {{ ollama_container_name }} ollama pull {{ ollama_default_model }}
      when: ollama_default_model not in ollama_list.stdout
      tags:
        - ollama

    # ------------------------------------------------------------------
    # 3. Bitcoin Core & Electrs Sovereign Full Node (Podman Quadlets)
    # ------------------------------------------------------------------
    - name: "Ensure Bitcoin Core and Electrs directories exist"
      ansible.builtin.command:
        cmd: "mkdir -p {{ item }}"
      loop:
        - "{{ bitcoin_data_dir }}"
        - "{{ electrs_data_dir }}"
      changed_when: false
      failed_when: false
      tags:
        - bitcoin

    - name: "Deploy Bitcoin Core Quadlet container unit"
      ansible.builtin.copy:
        dest: "{{ user_home }}/.config/containers/systemd/bitcoind.container"
        content: |
          # Managed by Ansible (dotfiles/ansible/local/setup_pc.yml)
          # Bitcoin Core - Sovereign Full Node (EUD)
          [Unit]
          Description=Bitcoin Core Sovereign Full Node (EUD)
          After=default.target

          [Container]
          Image={{ bitcoin_image }}
          ContainerName=bitcoind
          Network=host
          Environment=UID=1000
          Environment=GID=1000
          Volume={{ bitcoin_data_dir }}:/home/bitcoin/.bitcoin:U,z
          Exec=bitcoind -conf=/home/bitcoin/.bitcoin/bitcoin.conf -datadir=/home/bitcoin/.bitcoin
          AutoUpdate=registry

          [Service]
          Restart=on-failure
          RestartSec=15
          TimeoutStartSec=300
          TimeoutStopSec=600
          Nice=19
          CPUSchedulingPolicy=idle
          IOSchedulingClass=idle
          MemoryHigh=4500M
          MemoryMax=5500M

          [Install]
          WantedBy=default.target
        mode: '0644'
      register: bitcoind_quadlet
      tags:
        - bitcoin

    - name: "Check if bitcoin.conf exists in cold vault mount"
      ansible.builtin.command:
        cmd: "podman unshare test -f {{ bitcoin_data_dir }}/bitcoin.conf"
      register: bitcoin_conf_check
      failed_when: false
      changed_when: false
      tags:
        - bitcoin

    - name: "Tune Bitcoin Core dbcache for 16 GB RAM workstation"
      ansible.builtin.command:
        cmd: "podman unshare sed -i -E 's/^dbcache=.*/dbcache={{ bitcoin_dbcache }}/' {{ bitcoin_data_dir }}/bitcoin.conf"
      register: bitcoin_dbcache_update
      changed_when: false
      failed_when: false
      when: bitcoin_conf_check.rc == 0
      tags:
        - bitcoin

    - name: "Deploy Electrs Electrum Server Quadlet unit"
      ansible.builtin.copy:
        dest: "{{ user_home }}/.config/containers/systemd/electrs.container"
        content: |
          # Managed by Ansible (dotfiles/ansible/local/setup_pc.yml)
          # Electrs - Electrum Rust Server (EUD)
          [Unit]
          Description=Electrs Electrum Server (EUD)
          After=bitcoind.service default.target
          Wants=bitcoind.service

          [Container]
          Image={{ electrs_image }}
          ContainerName=electrs
          Network=host
          Volume={{ electrs_data_dir }}:/data:U,z
          Volume={{ bitcoin_data_dir }}:/data/.bitcoin:ro,z
          Exec=--db-dir=/data/db --daemon-dir=/data/.bitcoin --cookie-file=/data/.bitcoin/.cookie --electrum-rpc-addr=0.0.0.0:50001 --daemon-rpc-addr=127.0.0.1:8332 --daemon-p2p-addr=127.0.0.1:8333 --log-filters=INFO
          AutoUpdate=registry

          [Service]
          Restart=on-failure
          RestartSec=15
          TimeoutStartSec=300

          [Install]
          WantedBy=default.target
        mode: '0644'
      register: electrs_quadlet
      tags:
        - bitcoin

    - name: "Reload systemd user daemon (Bitcoin Quadlets)"
      ansible.builtin.systemd:
        daemon_reload: true
        scope: user
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
      when: bitcoind_quadlet is changed or electrs_quadlet is changed
      tags:
        - bitcoin
