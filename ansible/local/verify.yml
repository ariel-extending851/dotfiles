---
# ==============================================================================
# verify.yml - Host Verification Suite (SRE Workstation Acceptance Testing)
# Read-only and strictly idempotent. Runs assertions against the live host.
# ==============================================================================
- name: "Host Verification Suite (SRE Workstation)"
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    user_home: "{{ lookup('env', 'HOME') }}"
  tasks:
    # --------------------------------------------------------------------------
    # 1. Podman User Socket Verification
    # --------------------------------------------------------------------------
    - name: "Check if Podman rootless socket exists"
      ansible.builtin.stat:
        path: "/run/user/{{ ansible_facts['user_uid'] }}/podman/podman.sock"
      register: podman_sock_stat

    - name: "Assert Podman socket is active and listening"
      ansible.builtin.assert:
        that:
          - podman_sock_stat.stat.exists
          - podman_sock_stat.stat.issock
        fail_msg: "FALHA: O socket do Podman não está ativo em /run/user/{{ ansible_facts['user_uid'] }}/podman/podman.sock!"
        success_msg: "OK: Socket do Podman ativo para DevPod e Docker CLI."

    # --------------------------------------------------------------------------
    # 2. DevPod Provider Configuration Verification
    # --------------------------------------------------------------------------
    - name: "Check DevPod providers"
      ansible.builtin.command:
        cmd: devpod provider list
      register: devpod_providers
      changed_when: false

    - name: "Assert DevPod is configured with Docker (Podman) as default"
      ansible.builtin.assert:
        that:
          - "'docker' in devpod_providers.stdout"
          - "'true' in devpod_providers.stdout"
        fail_msg: "FALHA: O DevPod não está com o provedor 'docker' (podman) ativo como default!"
        success_msg: "OK: DevPod pronto com integração nativa ao Podman."

    # --------------------------------------------------------------------------
    # 3. Dotfiles & GNU Stow Symlinks Verification
    # --------------------------------------------------------------------------
    - name: "Check Stow symlinks in $HOME"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: dotfiles_stat
      loop:
        - "{{ user_home }}/.bash_aliases"
        - "{{ user_home }}/.config/starship.toml"

    - name: "Assert dotfiles are valid symlinks"
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.islnk
        fail_msg: "FALHA: Arquivo {{ item.stat.path }} não existe ou não é um symlink do Stow!"
        success_msg: "OK: Dotfile {{ item.stat.path }} corretamente symlinkado."
      loop: "{{ dotfiles_stat.results }}"

    # --------------------------------------------------------------------------
    # 4. Host Minimal Essential Bootstrap Tools Verification
    # --------------------------------------------------------------------------
    - name: "Check availability of minimal essential Host tools"
      ansible.builtin.command:
        cmd: "{{ 'tmux -V' if item == 'tmux' else item ~ ' --version' }}"
      register: cli_tools_check
      loop:
        - tmux
        - stow
        - mise
        - distrobox
        - jq
        - bw
      changed_when: false

    - name: "Assert minimal essential Host tools executed successfully"
      ansible.builtin.assert:
        that:
          - item.rc == 0
        fail_msg: "FALHA: A ferramenta essencial do host {{ item.item }} não está instalada ou falhou ao executar!"
        success_msg: "OK: Ferramenta essencial do host {{ item.item }} operacional."
      loop: "{{ cli_tools_check.results }}"

    # --------------------------------------------------------------------------
    # 5. Hardware NVIDIA & Secure Boot Verification
    # --------------------------------------------------------------------------
    - name: "Check Secure Boot status"
      ansible.builtin.command:
        cmd: mokutil --sb-state
      register: sb_state
      changed_when: false
      failed_when: false

    - name: "Assert Secure Boot status"
      ansible.builtin.assert:
        that:
          - sb_state.rc == 0
        fail_msg: "FALHA: mokutil falhou ao consultar estado do Secure Boot!"
        success_msg: "{{ 'OK: Secure Boot ativo e validado.' if 'SecureBoot enabled' in sb_state.stdout else 'AVISO: Secure Boot desabilitado no UEFI (driver NVIDIA funcional).' }}"

    - name: "Check NVIDIA GPU acceleration"
      ansible.builtin.command:
        cmd: nvidia-smi
      register: nvidia_check
      changed_when: false
      failed_when: false

    - name: "Assert NVIDIA GPU driver is functional"
      ansible.builtin.assert:
        that:
          - nvidia_check.rc == 0
        fail_msg: "AVISO: Driver NVIDIA não reportou aceleração via nvidia-smi."
        success_msg: "OK: Driver NVIDIA acelerando com sucesso."

    # --------------------------------------------------------------------------
    # 6. EUD - Ollama Local AI Verification
    # --------------------------------------------------------------------------
    - name: "Check Ollama API health"
      ansible.builtin.uri:
        url: "http://localhost:11434/api/tags"
        method: GET
        status_code: 200
      register: ollama_verify
      failed_when: false

    - name: "Assert Ollama is running and responsive"
      ansible.builtin.assert:
        that:
          - ollama_verify.status == 200
        fail_msg: "FALHA: Ollama não está respondendo em http://localhost:11434!"
        success_msg: "OK: Ollama API ativa e responsiva."

    - name: "Check Ollama llama3:8b model is available"
      ansible.builtin.uri:
        url: "http://localhost:11434/api/tags"
        method: GET
        return_content: true
      register: ollama_models
      failed_when: false

    - name: "Assert llama3:8b model is loaded"
      ansible.builtin.assert:
        that:
          - "'llama3' in ollama_models.content"
        fail_msg: "AVISO: Modelo llama3:8b não encontrado no Ollama."
        success_msg: "OK: Modelo llama3:8b disponível no Ollama."

    # --------------------------------------------------------------------------
    # 7. EUD - Flatpak SDR Applications Verification
    # --------------------------------------------------------------------------
    - name: "Check installed Flatpak SDR applications"
      ansible.builtin.command:
        cmd: flatpak list --app --columns=application
      register: flatpak_list
      changed_when: false

    - name: "Assert SDR Flatpak applications are installed"
      ansible.builtin.assert:
        that:
          - "'dk.gqrx.gqrx' in flatpak_list.stdout"
          - "'org.qgis.qgis' in flatpak_list.stdout"
          - "'com.chirpmyradio.chirp' in flatpak_list.stdout"
        fail_msg: "FALHA: Nem todos os Flatpaks SDR estão instalados!"
        success_msg: "OK: Todos os Flatpaks SDR/Rádio operacionais."

    - name: "Check Brave GPU flags configuration"
      ansible.builtin.slurp:
        src: "{{ ansible_facts['env']['HOME'] }}/.var/app/com.brave.Browser/config/brave-flags.conf"
      register: brave_flags_slurp

    - name: "Assert Brave GPU hardware acceleration flags exist"
      ansible.builtin.assert:
        that:
          - "'VaapiOnNvidiaGPUs' in (brave_flags_slurp.content | b64decode)"
          - "'VaapiIgnoreDriverChecks' in (brave_flags_slurp.content | b64decode)"
          - "'AcceleratedVideoDecodeLinuxGL' in (brave_flags_slurp.content | b64decode)"
        fail_msg: "AVISO: Flags de aceleração por GPU do Brave incompletas ou ausentes."
        success_msg: "OK: Flags de decodificação por GPU do Brave (NVDEC/VA-API) operacionais."

    - name: "Check Brave Flatpak overrides configuration"
      ansible.builtin.command:
        cmd: flatpak override --user --show com.brave.Browser
      register: brave_overrides_check
      changed_when: false
      failed_when: false

    - name: "Assert Brave Flatpak VA-API overrides are active"
      ansible.builtin.assert:
        that:
          - "'LIBVA_DRIVER_NAME=nvidia' in brave_overrides_check.stdout"
          - "'LIBVA_DRIVERS_PATH=' in brave_overrides_check.stdout"
          - "'NVD_BACKEND=direct' in brave_overrides_check.stdout"
        fail_msg: "AVISO: Overrides de ambiente VA-API do Brave Flatpak ausentes."
        success_msg: "OK: Variáveis de ambiente VA-API/NVDEC ativas no sandbox Flatpak do Brave."

    - name: "Check if SatDump is installed (rpm-ostree)"
      ansible.builtin.command:
        cmd: rpm -q SatDump
      register: satdump_installed
      changed_when: false
      failed_when: false

    - name: "Assert SatDump is installed"
      ansible.builtin.assert:
        that:
          - satdump_installed.rc == 0
        fail_msg: "AVISO: SatDump não está instalado. Execute 'mise run apply:eud:satdump' com -K."
        success_msg: "OK: SatDump (satélites meteorológicos) instalado."

    # --------------------------------------------------------------------------
    # 8. EUD - Bitcoin Core & Electrs Sovereign Full Node Verification
    # --------------------------------------------------------------------------
    - name: "Check Bitcoin Core container status"
      ansible.builtin.command:
        cmd: podman ps --format "{{ '{{' }}.Names{{ '}}' }}" --filter name=bitcoind
      register: bitcoind_ps
      changed_when: false
      failed_when: false

    - name: "Assert Bitcoin Core container is running"
      ansible.builtin.assert:
        that:
          - "'bitcoind' in bitcoind_ps.stdout"
        fail_msg: "AVISO: Container bitcoind não está rodando."
        success_msg: "OK: Bitcoin Core ativo e sincronizando blockchain soberana no disco de 1.8 TB."

    - name: "Check bitcoind Quadlet unit file configuration"
      ansible.builtin.slurp:
        src: "{{ ansible_facts['env']['HOME'] }}/.config/containers/systemd/bitcoind.container"
      register: bitcoind_unit_slurp

    - name: "Assert Bitcoin Core runs with idle scheduling and memory limits"
      ansible.builtin.assert:
        that:
          - "'Nice=19' in (bitcoind_unit_slurp.content | b64decode)"
          - "'CPUSchedulingPolicy=idle' in (bitcoind_unit_slurp.content | b64decode)"
          - "'MemoryHigh=4500M' in (bitcoind_unit_slurp.content | b64decode)"
        fail_msg: "AVISO: Quadlet do Bitcoin Core não possui governança de CPU/RAM configurada."
        success_msg: "OK: Bitcoin Core calibrado com prioridade IDLE e teto de RAM para preservar desktop."

    - name: "Check Electrs Electrum Server container status"
      ansible.builtin.command:
        cmd: podman ps --format "{{ '{{' }}.Names{{ '}}' }}" --filter name=electrs
      register: electrs_ps
      changed_when: false
      failed_when: false

    - name: "Assert Electrs Electrum Server container is running"
      ansible.builtin.assert:
        that:
          - "'electrs' in electrs_ps.stdout"
        fail_msg: "AVISO: Container electrs não está rodando."
        success_msg: "OK: Electrs ativo, servindo carteiras soberanas na porta 50001."

    # --------------------------------------------------------------------------
    # 9. Distrobox SRE & Platform Engineering Toolkit Verification
    # --------------------------------------------------------------------------

    - name: "Check if Distrobox CLI is available on host"
      ansible.builtin.command:
        cmd: distrobox --version
      register: distrobox_cmd
      changed_when: false
      failed_when: false

    - name: "Assert Distrobox CLI is installed"
      ansible.builtin.assert:
        that:
          - distrobox_cmd.rc == 0
        fail_msg: "FALHA: Distrobox não encontrado no PATH!"
        success_msg: "OK: Distrobox CLI disponível no host."

    - name: "Check if sre-toolbox Distrobox container exists"
      ansible.builtin.command:
        cmd: distrobox list
      register: distrobox_list_verify
      changed_when: false
      failed_when: false

    - name: "Assert sre-toolbox container is created"
      ansible.builtin.assert:
        that:
          - "'sre-toolbox' in distrobox_list_verify.stdout"
        fail_msg: "AVISO: Container sre-toolbox não encontrado. Execute 'mise run apply:distrobox'."
        success_msg: "OK: Container sre-toolbox presente no Distrobox."

    - name: "Validate SRE CLI tools inside sre-toolbox container"
      ansible.builtin.command:
        cmd: "distrobox enter sre-toolbox --no-tty -- {{ item.cmd }}"
      loop:
        - { name: "OpenTofu", cmd: "tofu --version" }
        - { name: "Terraform", cmd: "terraform -version" }
        - { name: "Terragrunt", cmd: "terragrunt --version" }
        - { name: "Ansible", cmd: "ansible --version" }
        - { name: "Docker CLI", cmd: "docker --version" }
        - { name: "Kubectl", cmd: "kubectl version --client" }
        - { name: "Helm", cmd: "helm version" }
        - { name: "K9s", cmd: "k9s version" }
        - { name: "Kind", cmd: "kind version" }
        - { name: "Trivy", cmd: "trivy --version" }
        - { name: "Golang", cmd: "go version" }
        - { name: "Python3", cmd: "python3 --version" }
        - { name: "Astral uv", cmd: "uv --version" }
        - { name: "AWS CLI", cmd: "aws --version" }
        - { name: "Google Cloud CLI", cmd: "gcloud --version" }
        - { name: "Azure CLI", cmd: "az --version" }
        - { name: "Neovim", cmd: "nvim --version" }
        - { name: "Eza", cmd: "eza --version" }
        - { name: "Bat", cmd: "bat --version" }
        - { name: "Zoxide", cmd: "zoxide --version" }
        - { name: "Fd", cmd: "fd --version" }
        - { name: "Dust", cmd: "dust --version" }
        - { name: "Procs", cmd: "procs --version" }
        - { name: "Btop", cmd: "btop --version" }
        - { name: "Delta", cmd: "delta --version" }
        - { name: "Starship", cmd: "starship --version" }
        - { name: "Lazygit", cmd: "lazygit --version" }
        - { name: "Lazydocker", cmd: "lazydocker --version" }
        - { name: "Tmux", cmd: "tmux -V" }
        - { name: "Bubblewrap", cmd: "bwrap --version" }
        - { name: "ai-jail", cmd: "ai-jail --version" }
        - { name: "Crush", cmd: "crush --version" }
        - { name: "OpenCode", cmd: "opencode --version" }
        - { name: "Claude Code", cmd: "claude --version" }
        - { name: "AIChat", cmd: "aichat --version" }
        - { name: "Ollama Client", cmd: "ollama --version" }
        - { name: "Antigravity CLI", cmd: "agy --version" }
      loop_control:
        label: "{{ item.name }}"
      register: sre_tools_verify
      changed_when: false
      failed_when: false
      when: "'sre-toolbox' in distrobox_list_verify.stdout"

    - name: "Assert SRE tools inside container executed successfully"
      ansible.builtin.assert:
        that:
          - item.rc == 0
        fail_msg: "AVISO: Ferramenta {{ item.item.name }} falhou dentro do sre-toolbox!"
        success_msg: "OK: Ferramenta {{ item.item.name }} operacional dentro do sre-toolbox."
      loop: "{{ sre_tools_verify.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name }}"
      when:
        - "'sre-toolbox' in distrobox_list_verify.stdout"
        - sre_tools_verify is defined
        - item.rc is defined

    # --------------------------------------------------------------------------
    # 11. Host Minimalism & Dotfiles Verification
    # --------------------------------------------------------------------------
    - name: "Verify Host Minimalism (Ensure non-essential tools are not on host)"
      ansible.builtin.command:
        cmd: "which {{ item }}"
      loop:
        - eza
        - lazygit
        - lazydocker
        - nvim
      register: host_minimalism_check
      failed_when: false
      changed_when: false

    - name: "Assert non-essential tools are purged from host"
      ansible.builtin.assert:
        that:
          - item.rc != 0
        fail_msg: "AVISO: {{ item.item }} ainda está instalado no Host. O Host deve permanecer minimalista!"
        success_msg: "OK: {{ item.item }} isolado fora do Host (conforme arquitetura minimalista)."
      loop: "{{ host_minimalism_check.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: "Verify LazyVim and Tmux dotfiles exist on host"
      ansible.builtin.stat:
        path: "{{ user_home }}/{{ item }}"
      loop:
        - ".config/nvim/init.lua"
        - ".tmux.conf"
      register: dotfiles_stat

    - name: "Assert LazyVim and Tmux configuration files exist"
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "AVISO: Arquivo {{ item.item }} não encontrado no HOME!"
        success_msg: "OK: Configuração {{ item.item }} stowed no HOME."
      loop: "{{ dotfiles_stat.results }}"
      loop_control:
        label: "{{ item.item }}"

    # --------------------------------------------------------------------------
    # 12. Multi-Layer Security & Network Hardening Verification
    # --------------------------------------------------------------------------
    - name: "Verify SELinux mode on Host"
      ansible.builtin.command:
        cmd: sestatus
      register: sestatus_check
      changed_when: false
      failed_when: false

    - name: "Assert SELinux is in Enforcing mode"
      ansible.builtin.assert:
        that:
          - "'Current mode:                   enforcing' in sestatus_check.stdout"
        fail_msg: "FALHA: SELinux não está em modo Enforcing no host!"
        success_msg: "OK: SELinux ativo e em modo Enforcing."

    - name: "Verify firewalld service status"
      ansible.builtin.command:
        cmd: systemctl is-active firewalld
      register: firewalld_status
      changed_when: false
      failed_when: false

    - name: "Assert firewalld is active"
      ansible.builtin.assert:
        that:
          - firewalld_status.stdout == "active"
        fail_msg: "FALHA: firewalld não está ativo!"
        success_msg: "OK: firewalld ativo e protegendo a interface física."

    - name: "Check SSH client config and directory permissions"
      ansible.builtin.stat:
        path: "{{ user_home }}/.ssh/config"
      register: ssh_config_verify

    - name: "Assert SSH client config is a managed Stow symlink"
      ansible.builtin.assert:
        that:
          - ssh_config_verify.stat.exists
          - ssh_config_verify.stat.islnk
        fail_msg: "FALHA: ~/.ssh/config não existe ou não é um symlink do Stow!"
        success_msg: "OK: ~/.ssh/config configurado com hardening e gerenciado pelo Stow."

    - name: "Check Gitleaks inside sre-toolbox container"
      ansible.builtin.command:
        cmd: distrobox enter sre-toolbox --no-tty -- gitleaks version
      register: gitleaks_check
      changed_when: false
      failed_when: false
      when: "'sre-toolbox' in distrobox_list_verify.stdout"

    - name: "Assert Gitleaks is installed and operational inside sre-toolbox"
      ansible.builtin.assert:
        that:
          - gitleaks_check.rc == 0
        fail_msg: "AVISO: Gitleaks não encontrado dentro do sre-toolbox!"
        success_msg: "OK: Gitleaks operacional para auditoria estática de segredos no sre-toolbox."
      when:
        - "'sre-toolbox' in distrobox_list_verify.stdout"
        - gitleaks_check is defined
        - gitleaks_check.rc is defined

    # --------------------------------------------------------------------------
    # 13. Omakase Visual Layer & COSMIC Integration Verification
    # --------------------------------------------------------------------------
    - name: "Check if JetBrainsMono Nerd Font is installed"
      ansible.builtin.stat:
        path: "{{ user_home }}/.local/share/fonts/JetBrainsMonoNerdFont-Regular.ttf"
      register: jb_font_verify

    - name: "Assert JetBrainsMono Nerd Font is present"
      ansible.builtin.assert:
        that:
          - jb_font_verify.stat.exists
        fail_msg: "FALHA: JetBrainsMono Nerd Font não está instalada em ~/.local/share/fonts!"
        success_msg: "OK: JetBrainsMono Nerd Font instalada e disponível."

    - name: "Check COSMIC dotfiles managed by Stow"
      ansible.builtin.stat:
        path: "{{ user_home }}/.config/cosmic/com.system76.CosmicTerm/v1/font_name"
      register: cosmic_term_font_verify

    - name: "Assert COSMIC terminal config is a managed Stow symlink"
      ansible.builtin.assert:
        that:
          - cosmic_term_font_verify.stat.exists
          - cosmic_term_font_verify.stat.islnk
        fail_msg: "FALHA: Configurações do cosmic-term não estão stowed no ~/.config/cosmic!"
        success_msg: "OK: cosmic-term gerenciado declarativamente pelo Stow."

    - name: "Check theme-switch CLI script"
      ansible.builtin.stat:
        path: "{{ user_home }}/.local/bin/theme-switch"
      register: theme_switch_stat

    - name: "Assert theme-switch CLI exists and is executable"
      ansible.builtin.assert:
        that:
          - theme_switch_stat.stat.exists
          - theme_switch_stat.stat.executable
        fail_msg: "FALHA: theme-switch não encontrado ou não executável em ~/.local/bin!"
        success_msg: "OK: theme-switch CLI operacional no PATH."

    # --------------------------------------------------------------------------
    # 14. Time Synchronization & Hardware Clock (RTC) Verification
    # --------------------------------------------------------------------------
    - name: "Check system time and hardware clock status via timedatectl"
      ansible.builtin.command:
        cmd: timedatectl status
      register: timedatectl_check
      changed_when: false

    - name: "Assert RTC is in UTC and timezone is America/Sao_Paulo"
      ansible.builtin.assert:
        that:
          - "'RTC in local TZ: no' in timedatectl_check.stdout"
          - "'America/Sao_Paulo' in timedatectl_check.stdout"
        fail_msg: "FALHA: RTC não está em UTC ou fuso horário não é America/Sao_Paulo!"
        success_msg: "OK: Timezone America/Sao_Paulo e RTC configurado em UTC."

    - name: "Check chrony tracking status"
      ansible.builtin.command:
        cmd: chronyc tracking
      register: chrony_tracking_check
      changed_when: false
      failed_when: false

    - name: "Assert chronyd is synchronized with Stratum >= 1"
      ansible.builtin.assert:
        that:
          - chrony_tracking_check.rc == 0
          - "'Leap status     : Normal' in chrony_tracking_check.stdout"
        fail_msg: "AVISO: chronyd ainda não sincronizou com os servidores NTP!"
        success_msg: "OK: chronyd sincronizado com servidores NTP (Leap status: Normal)."
      when: chrony_tracking_check.rc == 0

    # --------------------------------------------------------------------------
    # 15. DNS Resolution & Security Verification
    # --------------------------------------------------------------------------
    - name: "Check DNS resolution via systemd-resolved"
      ansible.builtin.command:
        cmd: resolvectl query a.st1.ntp.br
      register: dns_resolve_check
      changed_when: false
      failed_when: false

    - name: "Assert DNS resolution is operational via systemd-resolved"
      ansible.builtin.assert:
        that:
          - dns_resolve_check.rc == 0
          - "'200.160.7.186' in dns_resolve_check.stdout"
        fail_msg: "FALHA: systemd-resolved não conseguiu resolver a.st1.ntp.br!"
        success_msg: "OK: systemd-resolved operacional com resolução DNS íntegra."



