---
# ==============================================================================
# defaults/main.yml for system_tuning role
# Configurable performance, networking, limits, and hardening parameters
# ==============================================================================

# --- Inotify & File Descriptors ---
system_tuning_inotify_max_user_watches: 1048576
system_tuning_inotify_max_user_instances: 1024
system_tuning_file_max: 2097152

# --- Memory & VFS Responsiveness ---
system_tuning_vm_swappiness: 10
system_tuning_vm_vfs_cache_pressure: 50
system_tuning_vm_max_map_count: 1048576

# --- Container & Network Routing ---
system_tuning_net_ip_forward: 1
system_tuning_net_somaxconn: 32768
system_tuning_net_tcp_max_syn_backlog: 16384
system_tuning_net_tcp_fastopen: 3

# --- Kernel Hardening & Memory Protection ---
system_tuning_kptr_restrict: 2
system_tuning_dmesg_restrict: 1
system_tuning_yama_ptrace_scope: 1

# --- Process and File Limits ---
system_tuning_nofile_limit: 65536
system_tuning_nproc_limit: 65536
