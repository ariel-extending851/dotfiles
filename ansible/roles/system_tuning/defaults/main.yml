---
# ==============================================================================
# defaults/main.yml for system_tuning role
# Configurable performance, networking, limits, and hardening parameters
# ==============================================================================

# --- Inotify & File Descriptors ---
tuning_inotify_max_user_watches: 1048576
tuning_inotify_max_user_instances: 1024
tuning_file_max: 2097152

# --- Memory & VFS Responsiveness ---
tuning_vm_swappiness: 10
tuning_vm_vfs_cache_pressure: 50
tuning_vm_max_map_count: 1048576

# --- Container & Network Routing ---
tuning_net_ip_forward: 1
tuning_net_somaxconn: 32768
tuning_net_tcp_max_syn_backlog: 16384
tuning_net_tcp_fastopen: 3

# --- Kernel Hardening & Memory Protection ---
tuning_kptr_restrict: 2
tuning_dmesg_restrict: 1
tuning_yama_ptrace_scope: 1

# --- Process and File Limits ---
tuning_nofile_limit: 65536
tuning_nproc_limit: 65536
