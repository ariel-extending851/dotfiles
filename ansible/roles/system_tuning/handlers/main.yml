---
- name: "Reload sysctl"
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: false
  listen: "reload sysctl"
  when: ansible_virtualization_type | default('') not in ['docker', 'container', 'podman', 'containerd']

- name: "Restart systemd-resolved"
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted
  listen: "restart systemd-resolved"
  when: ansible_virtualization_type | default('') not in ['docker', 'container', 'podman', 'containerd']
