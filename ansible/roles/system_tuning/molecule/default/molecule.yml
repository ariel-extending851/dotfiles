---
dependency:
  name: galaxy
driver:
  name: "${MOLECULE_DRIVER:-podman}"
platforms:
  - name: instance
    image: "${MOLECULE_IMAGE:-geerlingguy/docker-fedora39-ansible:latest}"
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
provisioner:
  name: ansible
verifier:
  name: ansible
