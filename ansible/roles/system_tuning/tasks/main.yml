---
# ==============================================================================
# tasks/main.yml for system_tuning role
# ==============================================================================

- name: "Deploy DevOps kernel performance tuning (/etc/sysctl.d/99-devops-performance.conf)"
  ansible.builtin.template:
    src: 99-devops-performance.conf.j2
    dest: /etc/sysctl.d/99-devops-performance.conf
    owner: root
    group: root
    mode: '0644'
  notify: "reload sysctl"

- name: "Deploy system security hardening rules (/etc/sysctl.d/99-security-hardening.conf)"
  ansible.builtin.template:
    src: 99-security-hardening.conf.j2
    dest: /etc/sysctl.d/99-security-hardening.conf
    owner: root
    group: root
    mode: '0644'
  notify: "reload sysctl"

- name: "Deploy DevOps process and file limits (/etc/security/limits.d/99-devops.conf)"
  ansible.builtin.template:
    src: 99-devops-limits.conf.j2
    dest: /etc/security/limits.d/99-devops.conf
    owner: root
    group: root
    mode: '0644'

- name: "Ensure /etc/systemd/resolved.conf.d directory exists"
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: "Deploy DNS security hardening (/etc/systemd/resolved.conf.d/99-dns-security.conf)"
  ansible.builtin.template:
    src: 99-dns-security.conf.j2
    dest: /etc/systemd/resolved.conf.d/99-dns-security.conf
    owner: root
    group: root
    mode: '0644'
  notify: "restart systemd-resolved"

