# ==============================================================================
# ~/.tmux.conf - Managed by GNU Stow (dotfiles)
# SRE, DevOps & Platform Engineering Workstation
# ==============================================================================

# 1. Prefix: Ctrl + a (screen-style)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
bind-key a last-window

# 2. General Settings
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -s escape-time 0
set -g focus-events on
set-window-option -g mode-keys vi

# Terminal & Colors
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# 3. Splits & Navigation
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"

# 4. Vim-like Copy Mode (Wayland wl-copy & X11)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"

# 5. Status Bar & Theme (Clean Dark Modern)
set -g status-position bottom
set -g status-style bg='#1e1e2e',fg='#cdd6f4'
set -g status-left-length 40
set -g status-right-length 100
set -g status-left '#[fg=#11111b,bg=#89b4fa,bold] #S #[bg=default] '
set -g status-right '#[fg=#a6adc8]#{pane_current_path} #[fg=#89b4fa]│ #[fg=#a6e3a1]%Y-%m-%d %H:%M '
setw -g window-status-current-format '#[fg=#11111b,bg=#a6e3a1,bold] #I:#W #[bg=default]'
setw -g window-status-format '#[fg=#6c7086] #I:#W '

# 6. Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'sainnhe/tmux-fzf'

# Continuum settings: auto-save every 15 min and auto-restore
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
